/* Hidden means hidden, whatever page hosts the app (the installable version adds the same rule) */
[hidden] { display: none !important; }

/* Layout: lesson notebook on the left, editor + always-dark terminal on the right; stacks on phones */
:root {
  --bg: #eef1f6;
  --paper: #fafbfd;
  --ink: #1b2433;
  --muted: #5b6578;
  --line: #d5dbe6;
  --accent: #2f5fb3;
  --accent-ink: #ffffff;
  --accent-soft: #dde6f6;
  --mustard: #b8860b;
  --ok: #24804e;
  --ok-soft: #dcefe3;
  --err: #c2413a;
  --err-soft: #f7e0de;
  --code-bg: #e7ecf4;
  --sel: rgba(47, 95, 179, 0.25);
  --syn-k: #8a3fa0;
  --syn-s: #2d7a3e;
  --syn-n: #b45f06;
  --syn-c: #7d879a;
  --syn-b: #1f6f8b;
  --syn-f: #2f5fb3;
  --term-bg: #0e1628;
  --side-bg: #1b2744;
  --term-fg: #dbe3f1;
  --term-dim: #8592ad;
  --term-prompt: #f2c14e;
  --term-ok: #6fd39a;
  --term-err: #ff8a80;
  --term-line: #26324f;
  --term-tut: #8fd3ff;
  --plot-bg: #ffffff;
  --code-size: 14px;
  --f-display: "Arcode C", "Pixelify Sans", "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1421; --paper: #151d2d; --ink: #e3e8f1; --muted: #98a3b8; --line: #2a3448;
    --accent: #7ea3ee; --accent-ink: #0e1421; --accent-soft: #1f2c47; --mustard: #f2c14e;
    --ok: #6fd39a; --ok-soft: #173327; --err: #ff8a80; --err-soft: #3a1f22;
    --code-bg: #1e2738; --sel: rgba(126, 163, 238, 0.32);
    --syn-k: #d59ae8; --syn-s: #8fd19e; --syn-n: #f2b56b; --syn-c: #7f8aa3; --syn-b: #6cc4d9; --syn-f: #7ea3ee;
    --term-bg: #060a13; --side-bg: #131c2f; --term-line: #222d48;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1421; --paper: #151d2d; --ink: #e3e8f1; --muted: #98a3b8; --line: #2a3448;
  --accent: #7ea3ee; --accent-ink: #0e1421; --accent-soft: #1f2c47; --mustard: #f2c14e;
  --ok: #6fd39a; --ok-soft: #173327; --err: #ff8a80; --err-soft: #3a1f22;
  --code-bg: #1e2738; --sel: rgba(126, 163, 238, 0.32);
  --syn-k: #d59ae8; --syn-s: #8fd19e; --syn-n: #f2b56b; --syn-c: #7f8aa3; --syn-b: #6cc4d9; --syn-f: #7ea3ee;
  --term-bg: #060a13; --side-bg: #131c2f; --term-line: #222d48;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { touch-action: manipulation; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 40px;
}
.wrap { max-width: 1320px; margin: 0 auto; display: grid; gap: 18px; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Header */
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand h1 { font-family: var(--f-display); font-weight: 700; font-size: 1.6rem; margin: 0; letter-spacing: 0; }
.brand h1 span { color: var(--mustard); }
.brand small { color: var(--muted); font-family: var(--f-mono); font-size: 0.76rem; }
.hright { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.seg { display: flex; background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: transparent; color: var(--muted); padding: 5px 14px; border-radius: 999px; font-weight: 700; font-size: 0.92rem; }
.seg button[aria-selected="true"], .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg.small button { padding: 5px 10px; font-family: var(--f-mono); font-size: 0.8rem; }
.icon-btn { display: inline-grid; place-items: center; border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 999px; height: 34px; min-width: 34px; padding: 0 10px; font-weight: 700; font-size: 0.85rem; }
.icon-btn:hover { border-color: var(--accent); }

.grid { display: grid; grid-template-columns: minmax(0, 410px) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 900px) { .grid { grid-template-columns: minmax(0, 1fr); } }

/* Panel */
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 16px; min-width: 0; }
.pills { display: flex; flex-wrap: wrap; gap: 5px; }
.pill {
  width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line);
  background: transparent; color: var(--muted); font-family: var(--f-mono); font-size: 0.78rem;
  display: grid; place-items: center; padding: 0; font-variant-numeric: tabular-nums;
}
.pill.done { background: var(--ok-soft); color: var(--ok); border-color: transparent; font-weight: 700; }
.pill.current { border: 2px solid var(--accent); color: var(--ink); font-weight: 700; }
.progress { height: 6px; background: var(--code-bg); border-radius: 99px; overflow: hidden; margin-top: -6px; }
.progress i { display: block; height: 100%; background: var(--ok); border-radius: 99px; }
.eyebrow { font-family: var(--f-mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.panel h2 { font-family: var(--f-display); font-weight: 700; font-size: 1.5rem; line-height: 1.15; margin: 4px 0 0; text-wrap: balance; letter-spacing: 0; }
.theory { display: grid; gap: 10px; }
.theory p { margin: 0; }
code { font-family: var(--f-mono); font-size: 0.86em; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
.ex { background: var(--code-bg); border-radius: 8px; overflow: hidden; }
.ex pre, .hintbox pre { margin: 0; font-family: var(--f-mono); font-size: 0.82rem; line-height: 1.6; padding: 10px 12px; overflow-x: auto; white-space: pre; font-variant-ligatures: none; }
/* an example is a small editor: the highlighted copy gives the size, the transparent textarea on top takes the typing */
.ex-code { position: relative; }
.ex .ex-hl, .ex-ta { font-family: var(--f-mono); font-size: 0.82rem; line-height: 1.6; padding: 10px 12px 14px; tab-size: 4; letter-spacing: 0;
  font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; white-space: pre; }
.ex .ex-hl { overflow: hidden; pointer-events: none; }
.ex-ta { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; border: 0; border-radius: 8px; resize: none; outline: none;
  overflow-x: auto; overflow-y: hidden; overflow-wrap: normal; word-break: normal;
  background: transparent; color: transparent; -webkit-text-fill-color: transparent; caret-color: var(--ink); }
.ex-ta::selection { background: var(--sel); }
.ex-ta:focus-visible { box-shadow: inset 0 0 0 2px var(--accent-soft); }
.ex-foot { display: flex; justify-content: flex-end; gap: 6px; padding: 0 8px 8px; }
.q-folder { display: block; font-family: var(--f-mono); font-size: 0.72rem; font-weight: 400; color: var(--muted); margin-bottom: 2px; }
.task { border-left: 3px solid var(--mustard); padding: 4px 0 4px 14px; display: grid; gap: 4px; }
.task .eyebrow { color: var(--mustard); }
.task p { margin: 0; }
.status { font-size: 0.9rem; color: var(--muted); }
.status.ok { color: var(--ok); font-weight: 700; }
.hintbox { background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; font-size: 0.93rem; display: grid; gap: 8px; }
.hintbox pre { background: var(--paper); border-radius: 6px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn {
  border: 1px solid var(--line); background: var(--paper); color: var(--ink);
  padding: 7px 14px; border-radius: 8px; font-weight: 700; font-size: 0.9rem;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.go { background: var(--ok); border-color: var(--ok); color: var(--paper); }
.btn.danger { background: var(--err); border-color: var(--err); color: var(--paper); }
.btn.tiny { padding: 4px 10px; font-size: 0.8rem; }
.btn:disabled { opacity: 0.45; cursor: default; }
.linkbtn { border: 0; background: none; color: var(--muted); text-decoration: underline; padding: 0; font-size: 0.85rem; }
.nav { justify-content: space-between; border-top: 1px solid var(--line); padding-top: 14px; }
.confirm { background: var(--err-soft); border-radius: 8px; padding: 12px; display: grid; gap: 10px; font-size: 0.92rem; }
.confirm p { margin: 0; }
.celebrate { background: var(--ok-soft); color: var(--ink); border-radius: 8px; padding: 12px; display: grid; gap: 10px; }
.celebrate p { margin: 0; }
.group { display: grid; gap: 8px; }
.plist { display: grid; gap: 4px; }
.prog { text-align: left; border: 1px solid transparent; background: transparent; color: var(--ink); font-family: var(--f-mono); font-size: 0.86rem; padding: 7px 10px; border-radius: 8px; }
.prog:hover { background: var(--code-bg); }
.prog.active { background: var(--accent-soft); border-color: var(--accent); font-weight: 600; }
.field { font-family: var(--f-mono); font-size: 0.86rem; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); min-width: 0; flex: 1 1 140px; }
.exlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.exlist li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.exlist li div { display: grid; min-width: 0; }
.exlist span { color: var(--muted); font-size: 0.85rem; }
table.cheat { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
table.cheat td { padding: 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
table.cheat td:first-child { font-family: var(--f-mono); font-size: 0.8rem; white-space: pre; padding-right: 12px; }
.cheat-wrap { overflow-x: auto; }

/* Syntax colors */
.t-k { color: var(--syn-k); }
.t-s { color: var(--syn-s); }
.t-n, .t-v { color: var(--syn-n); }
.t-c { color: var(--syn-c); font-style: italic; }
.t-b { color: var(--syn-b); }
.t-f { color: var(--syn-f); }

/* Workspace */
.work { display: grid; gap: 14px; min-width: 0; }
.editor-card { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; min-width: 0; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px 8px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.file { font-family: var(--f-mono); font-size: 0.82rem; color: var(--muted); display: flex; align-items: center; gap: 8px; min-width: 0; }
.file b { color: var(--ink); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mustard); flex: none; }
.kbd { font-family: var(--f-mono); font-size: 0.72rem; color: var(--muted); }
@media (pointer: coarse) { .kbd { display: none; } }
.editor { display: grid; grid-template-columns: auto minmax(0, 1fr); height: 340px; resize: vertical; overflow: hidden; min-height: 160px; }
@media (max-width: 900px) { .editor { height: 290px; } }
.gutter, .hl, textarea#code {
  font-family: var(--f-mono); font-size: var(--code-size); line-height: 1.6; tab-size: 4;
  font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; letter-spacing: 0;
}
.gutter {
  color: var(--muted); text-align: right; padding: 12px 10px 60px 14px; user-select: none; overflow: hidden;
  background: var(--code-bg); font-variant-numeric: tabular-nums; min-width: 46px; white-space: pre; margin: 0;
}
.gutter .eln { color: var(--paper); background: var(--err); border-radius: 3px; padding: 0 3px; }
.code-wrap { position: relative; overflow: hidden; min-width: 0; }
.hl, textarea#code { position: absolute; inset: 0; margin: 0; padding: 12px 14px; white-space: pre; border: 0; }
.hl { overflow: hidden; pointer-events: none; color: var(--ink); background: var(--paper); }
.hl > code { display: block; width: max-content; min-width: 100%; padding: 0 60px 60px 0; background: none; border-radius: 0; font-size: inherit; }
textarea#code {
  width: 100%; height: 100%; resize: none; outline: none; overflow: auto;
  background: transparent; color: transparent; -webkit-text-fill-color: transparent; caret-color: var(--ink);
  overflow-wrap: normal; word-break: normal;
}
textarea#code::selection { background: var(--sel); }
textarea#code:focus-visible { box-shadow: inset 0 0 0 2px var(--accent-soft); }
.symbar { display: flex; gap: 6px; overflow-x: auto; padding: 8px 10px; border-top: 1px solid var(--line); }
.symbar button {
  flex: none; min-width: 38px; height: 36px; border: 1px solid var(--line); border-radius: 7px;
  background: var(--code-bg); color: var(--ink); font-family: var(--f-mono); font-size: 0.95rem; padding: 0 8px;
}
@media (pointer: fine) { .symbar { display: none; } }

.term-card { background: var(--term-bg); border-radius: 14px; overflow: hidden; min-width: 0; border: 1px solid var(--term-line); }
.term-card .bar { border-color: var(--term-line); }
.term-card .file { color: var(--term-dim); }
.term-card .file b { color: var(--term-fg); }
.tbtn { border: 1px solid var(--term-line); background: transparent; color: var(--term-fg); padding: 5px 12px; border-radius: 7px; font-size: 0.84rem; font-weight: 700; }
.tbtn:hover { border-color: var(--term-dim); }
.tbtn.stop { color: var(--term-err); border-color: var(--term-err); }
#term {
  font-family: var(--f-mono); font-size: var(--code-size); line-height: 1.6; color: var(--term-fg);
  padding: 12px 14px 16px; height: 300px; overflow-y: auto; white-space: pre-wrap; word-break: break-word;
  font-variant-ligatures: none; cursor: text;
}
#term .cmd { color: var(--term-prompt); }
#term .dim { color: var(--term-dim); }
#term .err { color: var(--term-err); }
#term .why { color: var(--term-dim); font-style: italic; font-family: var(--f-body); }
#term .pass { color: var(--term-ok); font-weight: 600; }
#term .fail { color: var(--term-prompt); }
#term .typed { color: var(--term-prompt); }
#term .ps { color: var(--term-dim); }
#term form { margin: 0; }
#term .tin { display: inline; }
#term .prow { display: flex; }
#term .prow .ps { flex: none; white-space: pre; }
#term input {
  font: inherit; color: var(--term-prompt); background: transparent; border: 0; outline: none; padding: 0;
  caret-color: var(--term-prompt); min-width: 0;
}
#term .tin input { border-bottom: 1px dashed var(--term-dim); width: 50%; min-width: 8ch; }
#term .prow input { flex: 1; white-space: pre; }
#term .tut { color: var(--term-tut); font-family: var(--f-body); }
#term img.plot { display: block; max-width: min(100%, 640px); height: auto; background: var(--plot-bg); border-radius: 6px; margin: 6px 0; }
/* Game screen (Pygame Zero): in place of the terminal, or over the whole page (.full). Always dark, like the terminal */
.stage { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; background: #05080f; color: var(--term-fg); font-family: var(--f-body); line-height: 1.35; container-type: inline-size; }
.stage.full { position: fixed; inset: 0; z-index: 95; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
html.staged, html.staged body { overflow: hidden; overscroll-behavior: none; }
.sbar { flex: none; display: flex; align-items: center; gap: 10px; min-width: 0; padding: 5px 6px 5px 12px; background: var(--side-bg); border-bottom: 1px solid var(--term-line); font-size: 0.86rem; }
.stitle { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.ssize { color: var(--term-dim); font-family: var(--f-mono); font-size: 0.74rem; white-space: nowrap; }
.sstate { color: var(--term-prompt); font-size: 0.8rem; font-weight: 700; white-space: nowrap; }
.stage.dead .sstate { color: var(--term-err); }
.sbtns { margin-left: auto; display: flex; gap: 6px; flex: none; }
.sbtn { display: inline-flex; align-items: center; gap: 6px; min-height: 34px; min-width: 34px; justify-content: center; border: 1px solid var(--term-line); background: transparent; color: var(--term-fg); padding: 4px 10px; border-radius: 8px; font: inherit; font-size: 0.82rem; font-weight: 700; }
.sbtn:hover { border-color: var(--term-dim); }
.sbtn.close:hover { border-color: var(--term-err); color: var(--term-err); }
.sbtn:focus-visible { outline: 2px solid var(--term-prompt); outline-offset: 1px; }
@container (max-width: 640px) { .sbtn .sl, .ssize { display: none; } .sbtn { padding: 4px 8px; } }
.sview { flex: 1 1 0; min-height: 0; position: relative; display: grid; place-items: center; overflow: hidden; }
.sview canvas { display: block; outline: none; background: #000; box-shadow: 0 0 0 1px var(--term-line); }
.sview canvas:focus-visible { box-shadow: 0 0 0 2px var(--term-prompt); }
.sveil { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(5, 8, 15, 0.6); }
.spanel { max-width: min(470px, 100%); max-height: 100%; overflow: auto; box-sizing: border-box; display: grid; gap: 10px; justify-items: start; background: var(--side-bg); border: 1px solid var(--term-line); border-radius: 12px; padding: 16px 18px; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45); }
.spanel b { font-size: 1.05rem; }
.spanel.err { border-color: var(--term-err); }
.spanel.err b { color: var(--term-err); }
.spanel code { font-family: var(--f-mono); font-size: 0.84rem; color: var(--term-err); background: rgba(255, 138, 128, 0.1); padding: 3px 7px; border-radius: 6px; white-space: pre-wrap; overflow-wrap: anywhere; }
.stage .btn.sgo { display: inline-flex; align-items: center; gap: 8px; }
.sbtn svg, .stage .btn svg { flex: none; }
.spanel p { margin: 0; font-size: 0.9rem; color: var(--term-dim); }
.srow { display: flex; flex-wrap: wrap; gap: 8px; }
.stage .btn { background: transparent; color: var(--term-fg); border-color: var(--term-line); box-shadow: none; }
.stage .btn.primary { background: var(--term-prompt); border-color: var(--term-prompt); color: #15203a; box-shadow: 0 3px 0 rgba(0, 0, 0, 0.35); }
.sfocus { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); pointer-events: none; background: rgba(6, 10, 19, 0.85); border: 1px solid var(--term-line); border-radius: 999px; padding: 4px 12px; font-size: 0.8rem; white-space: nowrap; }
/* On-screen controls: a cross of arrows and round buttons, under the game (or at its sides on a phone held sideways) */
.spad { flex: none; order: 9; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 18px 14px; border-top: 1px solid var(--term-line); background: #05080f; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; }
.spad[hidden] { display: none; }
.sdpad { position: relative; flex: none; width: 160px; height: 160px; touch-action: none; }
.sdpad.row { width: 170px; height: 76px; }
.sdir { position: absolute; width: 56px; height: 56px; display: grid; place-items: center; border-radius: 14px; background: rgba(255, 255, 255, 0.07); border: 1px solid var(--term-line); color: var(--term-fg); transition: background 0.06s; }
.sdir svg { width: 22px; height: 22px; }
.sdir.up { left: 52px; top: 0; }
.sdir.down { left: 52px; bottom: 0; }
.sdir.left { left: 0; top: 52px; }
.sdir.right { right: 0; top: 52px; }
.sdir.left svg { transform: rotate(-90deg); }
.sdir.right svg { transform: rotate(90deg); }
.sdir.down svg { transform: rotate(180deg); }
.sdpad.row .sdir { top: 0; width: 76px; height: 76px; border-radius: 18px; }
.sdir.on, .sact.on { background: var(--term-prompt); border-color: var(--term-prompt); color: #15203a; }
.sacts { display: flex; flex-wrap: wrap-reverse; justify-content: flex-end; align-items: center; gap: 10px; max-width: 52%; }
.sact { min-width: 66px; height: 66px; padding: 0 14px; border-radius: 33px; background: rgba(255, 255, 255, 0.07); border: 1px solid var(--term-line); color: var(--term-fg); font: inherit; font-weight: 700; font-size: 0.95rem; touch-action: none; transition: background 0.06s; }
.stage.pad-side .spad { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; border-top: 0; background: transparent; pointer-events: none; padding: 12px calc(18px + env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) calc(18px + env(safe-area-inset-left, 0px)); }
.stage.pad-side .spad > * { pointer-events: auto; }
.stage.pad-side .sacts { max-width: 146px; }
.stage.pad-side .sdir, .stage.pad-side .sact { background: rgba(5, 8, 15, 0.55); }
.stage.pad-side .sdir.on, .stage.pad-side .sact.on { background: var(--term-prompt); }
/* long press on the game: a ring that fills, then the right click (the flag) */
.sring { position: absolute; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%; border: 3px solid var(--term-prompt); pointer-events: none; animation: sring 0.45s linear forwards; }
.sring.go { background: rgba(242, 193, 78, 0.35); animation: none; }
@keyframes sring { from { transform: scale(0.35); opacity: 0.25; } to { transform: scale(1); opacity: 0.95; } }
.sout { flex: none; margin: 0; max-height: 5.4em; overflow: auto; padding: 6px 12px; border-top: 1px solid var(--term-line); background: var(--term-bg); color: var(--term-fg); font-family: var(--f-mono); font-size: 0.8rem; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
.note { font-size: 0.84rem; color: var(--muted); margin: 0; }

/* Terminal page: terminal takes the wide column, guide sits beside it */
.grid.termview #editor-card { display: none; }
.grid.termview #term { height: max(380px, calc(100vh - 230px)); height: max(380px, calc(100dvh - 230px)); }
@media (max-width: 900px) {
  .grid.termview #term { height: max(340px, calc(100vh - 300px)); height: max(340px, calc(100dvh - 300px)); }
  .thint { display: none; }
}
.term-card .symbar { border-top: 1px solid var(--term-line); }
.term-card .symbar button { background: var(--term-line); color: var(--term-fg); border-color: var(--term-line); }
.tutcard { border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; }
.tutcard p { margin: 0; }
.tutcard .tutlabel { color: var(--accent); }
.tutnow { font-size: 0.95rem; }
.tutcard .progress { margin-top: 0; }
.notice { background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; font-size: 0.92rem; }
.notice a, .theory a { color: var(--accent); }
.pill.bonus:not(.done) { border-style: dashed; }
@media (prefers-reduced-motion: no-preference) {
  .btn, .pill, .seg button, .prog, .progress i { transition: background-color .15s, border-color .15s, color .15s, width .3s; }
}

/* Header rank */
.rank { display: flex; align-items: center; gap: 8px; background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-size: 0.82rem; }
.rname { font-weight: 700; }
.rbytes { font-family: var(--f-mono); font-size: 0.76rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.rbar { width: 54px; height: 6px; border-radius: 99px; background: var(--code-bg); overflow: hidden; }
.rbar i { display: block; height: 100%; background: var(--mustard); border-radius: 99px; }
button.rank { font-family: inherit; color: inherit; line-height: 1.2; cursor: pointer; text-align: left; }
button.rank:hover { border-color: var(--mustard); }
button.rank:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* The ranks of the path */
.rkcard { width: min(560px, 100%); }
.rk-now { background: var(--code-bg); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; }
.rk-now p { margin: 0; }
.rk-now b { font-family: var(--f-display); font-size: 1.2rem; }
.rk-big { height: 10px; border-radius: 99px; background: var(--paper); overflow: hidden; }
.rk-big i { display: block; height: 100%; background: var(--mustard); border-radius: 99px; }
.rk-how { margin: 0; font-size: 0.85rem; }
.rk-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.rk { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); }
.rk-m { width: 38px; display: grid; place-items: center; }
.rk-m .px { width: 38px; height: 34px; }
.rk-start { width: 30px; height: 30px; border-radius: 50%; background: var(--code-bg); color: var(--muted); font-size: 0.75rem; }
.rk-main { display: grid; gap: 2px; min-width: 0; }
.rk-name { font-weight: 700; }
.rk-where { font-size: 0.8rem; color: var(--muted); }
.rk-at { font-family: var(--f-mono); font-size: 0.78rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.rk.done .rk-at { color: var(--ok); }
.rk.cur { border: 2px solid var(--mustard); padding: 7px 11px; }
.rk.cur .rk-at { color: var(--ok); }
.rk.lock { opacity: 0.62; }
.rk.lock .rk-m .px { filter: grayscale(1); }
.rk-you { display: inline-block; margin-left: 6px; padding: 0 8px; border-radius: 99px; border: 1px solid var(--mustard); font-size: 0.7rem; font-weight: 700; vertical-align: 1px; }
#sound .mute { display: none; }
#sound.muted .mute { display: inline; }
#sound.muted .waves { display: none; }
.px { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }

/* Explorer: an editor-style file tree with a README preview */
.ide { background: var(--side-bg); color: var(--term-fg); border: 1px solid var(--term-line); border-radius: 14px; overflow: hidden; }
.ide-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 12px 10px 16px; border-bottom: 1px solid var(--term-line); }
.ide-title { font-family: var(--f-mono); font-size: 0.76rem; letter-spacing: 0.1em; color: var(--term-dim); }
.ide-title span { color: var(--term-fg); letter-spacing: 0; margin-left: 6px; }
.ide-stars { font-family: var(--f-mono); font-size: 0.8rem; color: var(--term-prompt); margin-left: auto; font-variant-numeric: tabular-nums; }
.ide-body { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); min-height: 540px; }
.tree { padding: 8px 0 16px; border-right: 1px solid var(--term-line); font-family: var(--f-mono); font-size: 0.88rem; }
.tr-row { width: 100%; display: flex; align-items: center; gap: 8px; border: 0; background: transparent; color: var(--term-fg); text-align: left; padding: 6px 14px; font: inherit; min-height: 36px; }
.tr-row:hover { background: rgba(255, 255, 255, 0.05); }
.tr-row:focus-visible { outline: 2px solid var(--term-prompt); outline-offset: -2px; }
.tr-folder .chev { color: var(--term-dim); flex: none; }
.tr-folder[aria-expanded="true"] .chev { transform: rotate(90deg); }
.tr-ic { display: flex; flex: none; }
.tr-folder .tr-ic { color: color-mix(in srgb, var(--wc) 72%, #ffffff); }
.tr-folder.sel { background: rgba(255, 255, 255, 0.07); }
.tr-folder.locked, .tr-folder.locked .tr-ic { color: var(--term-dim); }
.tr-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: none; max-width: 60%; }
.tr-title { color: var(--term-dim); font-family: var(--f-body); font-size: 0.84rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.tr-meta { margin-left: auto; color: var(--term-dim); font-size: 0.78rem; display: flex; align-items: center; gap: 4px; white-space: nowrap; flex: none; font-variant-numeric: tabular-nums; }
.tr-files { position: relative; }
.tr-files::before { content: ""; position: absolute; left: 21px; top: 0; bottom: 8px; width: 1px; background: var(--term-line); }
.tr-file { padding-left: 38px; }
.tr-file .tr-ic { color: color-mix(in srgb, var(--wc) 65%, #ffffff); }
.tr-file.lock { color: var(--term-dim); cursor: not-allowed; }
.tr-file.lock .tr-ic { color: var(--term-dim); }
.tr-file.lock .tr-title { opacity: 0.55; }
.tr-file.cur { background: color-mix(in srgb, var(--wc) 24%, transparent); }
.tr-file.boss:not(.lock) .tr-ic { color: #ff8a6b; }
.tr-st { color: var(--term-prompt); letter-spacing: 1px; }
.tr-st i { font-style: normal; color: var(--term-dim); opacity: 0.45; }
.tr-cur { color: var(--term-ok); }
.readme { background: var(--paper); color: var(--ink); display: flex; flex-direction: column; min-width: 0; }
.rm-tab { font-family: var(--f-mono); font-size: 0.78rem; color: var(--muted); padding: 9px 16px; border-bottom: 1px solid var(--line); background: var(--code-bg); }
.rm-body { padding: 20px; display: grid; gap: 12px; align-content: start; }
.rm-hero { display: flex; gap: 14px; align-items: center; }
.rm-m { width: 114px; height: 102px; border-radius: 12px; background: color-mix(in srgb, var(--wc) 14%, transparent); display: grid; place-items: center; flex: none; }
.rm-m .px { width: 114px; height: 102px; }
.readme.locked .rm-m .px { filter: grayscale(1); opacity: 0.6; }
.rm-hd { min-width: 0; }
.rm-dir { font-family: var(--f-mono); font-size: 0.8rem; color: var(--muted); }
.readme h2 { margin: 2px 0 0; font-family: var(--f-display); font-weight: 700; font-size: 1.5rem; letter-spacing: 0; text-wrap: balance; }
.readme h3 { margin: 4px 0 0; font-size: 1rem; }
.md { color: var(--muted); font-family: var(--f-mono); font-weight: 400; }
.rm-tag { margin: 4px 0 0; color: var(--muted); }
.rm-quote { margin: 0; border-left: 3px solid var(--wc); padding: 8px 12px; background: var(--code-bg); font-size: 0.95rem; }
.rm-bar { height: 8px; border-radius: 99px; background: var(--code-bg); overflow: hidden; }
.rm-bar i { display: block; height: 100%; background: var(--wc); border-radius: 99px; }
.rm-stars { margin: 0; font-family: var(--f-mono); color: var(--mustard); }
.rm-note { margin: 0; color: var(--muted); }
#rm-open { justify-self: start; }
@media (max-width: 760px) {
  .ide-body { grid-template-columns: minmax(0, 1fr); min-height: 0; }
  .readme { order: -1; border-bottom: 1px solid var(--term-line); }
  .tree { border-right: 0; }
  .rm-body { padding: 14px; gap: 10px; }
  .rm-m, .rm-m .px { width: 76px; height: 68px; }
  .readme h2 { font-size: 1.25rem; }
  .tr-title { display: none; }
  .tr-name { max-width: none; flex: 1; }
}

/* Quest: what to do, right above the editor */
.quest { background: var(--paper); border: 2px solid var(--mustard); border-radius: 14px; padding: 14px 16px; display: grid; gap: 10px; min-width: 0; }
.q-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.q-tag { font-family: var(--f-mono); font-size: 0.8rem; font-weight: 600; color: var(--mustard); }
.q-file { font-family: var(--f-mono); font-size: 0.78rem; color: var(--muted); }
.q-stars { margin-left: auto; display: flex; gap: 2px; color: var(--line); font-size: 1.05rem; }
.q-stars .on { color: var(--mustard); }
.q-task { margin: 0; font-size: 1.05rem; line-height: 1.5; }
.q-actions .rule { margin-left: auto; }
.crumb { font-family: var(--f-mono); font-size: 0.8rem; color: var(--muted); overflow-wrap: anywhere; }
.crumb b { color: var(--ink); font-weight: 600; }

/* Level panel */
.lv-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.lv-mascot { display: flex; align-items: center; gap: 12px; }
.lv-mascot .px { width: 95px; height: 85px; flex: none; }

.qopts.wide { grid-template-columns: minmax(0, 1fr); }
.q-ask { margin: 0; font-size: 1rem; line-height: 1.45; }

/* Quizzes with several questions */

/* Tap the line / put the lines in order */
.spot, .ord-prog, .ord-pool { display: grid; gap: 4px; min-width: 0; }
.spot, .ord-prog { background: var(--code-bg); border-radius: 8px; padding: 6px; }

.ord-ln.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.ord-ln.bad { border-color: var(--err); background: var(--err-soft); }
.ord-pool .ord-ln { background: var(--paper); border: 1px dashed var(--line); }

/* A sample of what the program prints, drawn like the terminal */

}
.panel.side {
  background: var(--side-bg); color: var(--term-fg); border-color: var(--term-line); padding: 0 0 8px; gap: 0; align-content: start;
  --ink: var(--term-fg); --muted: var(--term-dim); --line: var(--term-line); --code-bg: rgba(255, 255, 255, 0.06); --paper: var(--side-bg);
  --accent: var(--term-prompt); --accent-ink: #15203a; --accent-soft: rgba(242, 193, 78, 0.14); --ok: var(--term-ok); --ok-soft: rgba(111, 211, 154, 0.14);
  --err-soft: rgba(255, 138, 128, 0.12); --wc: var(--term-prompt);
  --syn-k: #d59ae8; --syn-s: #8fd19e; --syn-n: #f2b56b; --syn-c: #7f8aa3; --syn-b: #6cc4d9; --syn-f: #7ea3ee;
}
.side-top { padding: 12px 16px; border-bottom: 1px solid var(--term-line); }
.side-intro { margin: 0; padding: 12px 16px; font-size: 0.9rem; color: var(--term-dim); border-bottom: 1px solid var(--term-line); }

.side-head { display: flex; align-items: center; }
.side-toggle { flex: 1; display: flex; align-items: center; gap: 6px; border: 0; background: none; color: var(--term-fg); font-family: var(--f-mono); font-size: 0.74rem; letter-spacing: 0.1em; text-transform: uppercase; padding: 11px 14px; text-align: left; }

   Plain text stays plain; code, the terminal and the recovery code stay monospaced. */
b, strong, h1, h2, h3, h4,
.btn, .seg button, .seg.small button, .icon-btn, .tbtn, .acct-btn, .acct-pick, .ff > span,

# Pygame Zero for the games (src/pgz.py, put here by build.py): loaded the first time a program imports pgzrun
_PGZ_SRC = "\"\"\"Pygame Zero for Arcode.\n\nThe same names and hooks as Pygame Zero (WIDTH, HEIGHT, TITLE, draw, update, on_key_down, screen, keyboard,\nkeys, mouse, clock, Rect), so a game written here also runs on a computer with `pip install pgzero`.\nA game starts like on a computer: `import pgzrun` at the top and `pgzrun.go()` at the end.\nNothing here touches the browser: a Game turns a step of time and the input events into a list of drawing\ncommands, which the app paints on a canvas and the tests can read.\n\"\"\"\nimport contextlib\nimport inspect\nimport io\nimport math\nimport numbers\nimport re\nimport sys\nimport types\n\n# ---------- colours (pygame's names: where X11 and CSS disagree, pygame's value wins) ----------\n_CSS = set(\"\"\"aliceblue antiquewhite aqua aquamarine azure beige bisque black blanchedalmond blue blueviolet brown\nburlywood cadetblue chartreuse chocolate coral cornflowerblue cornsilk crimson cyan darkblue darkcyan darkgoldenrod\ndarkgray darkgreen darkgrey darkkhaki darkmagenta darkolivegreen darkorange darkorchid darkred darksalmon\ndarkseagreen darkslateblue darkslategray darkslategrey darkturquoise darkviolet deeppink deepskyblue dimgray dimgrey\ndodgerblue firebrick floralwhite forestgreen fuchsia gainsboro ghostwhite gold goldenrod gray green greenyellow grey\nhoneydew hotpink indianred indigo ivory khaki lavender lavenderblush lawngreen lemonchiffon lightblue lightcoral\nlightcyan lightgoldenrodyellow lightgray lightgreen lightgrey lightpink lightsalmon lightseagreen lightskyblue\nlightslategray lightslategrey lightsteelblue lightyellow lime limegreen linen magenta maroon mediumaquamarine\nmediumblue mediumorchid mediumpurple mediumseagreen mediumslateblue mediumspringgreen mediumturquoise\nmediumvioletred midnightblue mintcream mistyrose moccasin navajowhite navy oldlace olive olivedrab orange orangered\norchid palegoldenrod palegreen paleturquoise palevioletred papayawhip peachpuff peru pink plum powderblue purple\nrebeccapurple red rosybrown royalblue saddlebrown salmon sandybrown seagreen seashell sienna silver skyblue\nslateblue slategray slategrey snow springgreen steelblue tan teal thistle tomato turquoise violet wheat white\nwhitesmoke yellow yellowgreen\"\"\".split())\n_PYGAME = {\"green\": \"#00ff00\", \"gray\": \"#bebebe\", \"grey\": \"#bebebe\", \"maroon\": \"#b03060\", \"purple\": \"#a020f0\"}\n_HEX = set(\"0123456789abcdef\")\n\n\ndef _real(x):\n    return isinstance(x, numbers.Real) and not isinstance(x, bool)\n\n\ndef color(c):\n    \"\"\"A pygame colour (name, '#rrggbb', '#rrggbbaa' or a tuple of 3 or 4 numbers 0-255) as a CSS colour.\"\"\"\n    if isinstance(c, str):\n        s = c.lower().replace(\" \", \"\")\n        if s in _PYGAME:\n            return _PYGAME[s]\n        if s in _CSS:\n            return s\n        if s.startswith(\"#\") and len(s) in (7, 9) and set(s[1:]) <= _HEX:\n            return s\n        raise ValueError(\"invalid color name: \" + repr(c))\n    if isinstance(c, (tuple, list)) and len(c) in (3, 4):\n        v = []\n        for x in c:\n            if not _real(x) or not 0 <= x <= 255:\n                raise ValueError(\"invalid color argument: \" + repr(c))\n            v.append(int(x))\n        if len(v) == 3:\n            return \"rgb(%d,%d,%d)\" % tuple(v)\n        return \"rgba(%d,%d,%d,%.3f)\" % (v[0], v[1], v[2], v[3] / 255)\n    raise ValueError(\"invalid color argument: \" + repr(c))\n\n\ndef _num(x, what):\n    \"\"\"A plain number for the drawing commands (numpy numbers too); NaN and infinity can't be drawn.\"\"\"\n    if not _real(x):\n        raise TypeError(\"%s must be a number, not %s\" % (what, type(x).__name__))\n    x = int(x) if isinstance(x, numbers.Integral) else float(x)\n    if isinstance(x, float) and not math.isfinite(x):\n        raise ValueError(\"%s can't be %r\" % (what, x))\n    return x\n\n\ndef _point(p, what=\"pos\"):\n    try:\n        x, y = p\n    except (TypeError, ValueError):\n        raise TypeError(\"%s must be a pair of numbers (x, y), not %r\" % (what, p)) from None\n    return [_num(x, what), _num(y, what)]\n\n\n# ---------- Rect (like pygame's, keeping fractions like Pygame Zero's ZRect) ----------\nclass Rect:\n    __slots__ = (\"x\", \"y\", \"w\", \"h\")\n\n    def __init__(self, *args):\n        if len(args) == 1:\n            a = args[0]\n            if isinstance(a, Rect):\n                args = (a.x, a.y, a.w, a.h)\n            else:\n                try:\n                    args = tuple(a)\n                except TypeError:\n                    raise TypeError(\"Argument must be rect style object\") from None\n                if len(args) == 2:\n                    args = tuple(args[0]) + tuple(args[1])\n        elif len(args) == 2:\n            args = tuple(args[0]) + tuple(args[1])\n        if len(args) != 4:\n            raise TypeError(\"Argument must be rect style object\")\n        self.x, self.y, self.w, self.h = (_num(v, \"Rect\") for v in args)\n\n    width = property(lambda s: s.w, lambda s, v: setattr(s, \"w\", v))\n    height = property(lambda s: s.h, lambda s, v: setattr(s, \"h\", v))\n    size = property(lambda s: (s.w, s.h), lambda s, v: s._set_size(v))\n\n    def _set_size(self, v):\n        self.w, self.h = v\n\n    left = property(lambda s: s.x, lambda s, v: setattr(s, \"x\", v))\n    top = property(lambda s: s.y, lambda s, v: setattr(s, \"y\", v))\n    right = property(lambda s: s.x + s.w, lambda s, v: setattr(s, \"x\", v - s.w))\n    bottom = property(lambda s: s.y + s.h, lambda s, v: setattr(s, \"y\", v - s.h))\n    centerx = property(lambda s: s.x + s.w / 2, lambda s, v: setattr(s, \"x\", v - s.w / 2))\n    centery = property(lambda s: s.y + s.h / 2, lambda s, v: setattr(s, \"y\", v - s.h / 2))\n\n    def _pt(fx, fy):\n        return property(lambda s: (getattr(s, fx), getattr(s, fy)),\n                        lambda s, v: (setattr(s, fx, v[0]), setattr(s, fy, v[1])))\n    topleft = _pt(\"left\", \"top\")\n    topright = _pt(\"right\", \"top\")\n    bottomleft = _pt(\"left\", \"bottom\")\n    bottomright = _pt(\"right\", \"bottom\")\n    center = _pt(\"centerx\", \"centery\")\n    midtop = _pt(\"centerx\", \"top\")\n    midbottom = _pt(\"centerx\", \"bottom\")\n    midleft = _pt(\"left\", \"centery\")\n    midright = _pt(\"right\", \"centery\")\n    del _pt\n\n    def copy(self):\n        return Rect(self.x, self.y, self.w, self.h)\n\n    def move(self, *d):\n        dx, dy = d[0] if len(d) == 1 else d\n        return Rect(self.x + dx, self.y + dy, self.w, self.h)\n\n    def move_ip(self, *d):\n        dx, dy = d[0] if len(d) == 1 else d\n        self.x += dx\n        self.y += dy\n\n    def inflate(self, dx, dy):\n        return Rect(self.x - dx / 2, self.y - dy / 2, self.w + dx, self.h + dy)\n\n    def inflate_ip(self, dx, dy):\n        self.x, self.y, self.w, self.h = self.x - dx / 2, self.y - dy / 2, self.w + dx, self.h + dy\n\n    def clamp(self, *o):\n        \"\"\"A copy moved inside the other rect (centred on it if it doesn't fit).\"\"\"\n        o = Rect(*o)\n        x = o.x + (o.w - self.w) / 2 if self.w >= o.w else min(max(self.x, o.x), o.x + o.w - self.w)\n        y = o.y + (o.h - self.h) / 2 if self.h >= o.h else min(max(self.y, o.y), o.y + o.h - self.h)\n        return Rect(x, y, self.w, self.h)\n\n    def clamp_ip(self, *o):\n        r = self.clamp(*o)\n        self.x, self.y = r.x, r.y\n\n    def union(self, *o):\n        o = Rect(*o)\n        x, y = min(self.x, o.x), min(self.y, o.y)\n        return Rect(x, y, max(self.x + self.w, o.x + o.w) - x, max(self.y + self.h, o.y + o.h) - y)\n\n    def clip(self, *o):\n        o = Rect(*o)\n        x, y = max(self.x, o.x), max(self.y, o.y)\n        r, b = min(self.x + self.w, o.x + o.w), min(self.y + self.h, o.y + o.h)\n        if r <= x or b <= y:\n            return Rect(self.x, self.y, 0, 0)\n        return Rect(x, y, r - x, b - y)\n\n    def colliderect(self, *o):\n        o = Rect(*o)\n        return (self.w > 0 and self.h > 0 and o.w > 0 and o.h > 0 and\n                self.x < o.x + o.w and o.x < self.x + self.w and self.y < o.y + o.h and o.y < self.y + self.h)\n\n    def collidepoint(self, *p):\n        x, y = p[0] if len(p) == 1 else p\n        return self.x <= x < self.x + self.w and self.y <= y < self.y + self.h\n\n    def contains(self, *o):\n        o = Rect(*o)\n        return self.x <= o.x and self.y <= o.y and o.x + o.w <= self.x + self.w and o.y + o.h <= self.y + self.h\n\n    def collidelist(self, rects):\n        for i, r in enumerate(rects):\n            if self.colliderect(r):\n                return i\n        return -1\n\n    def collidelistall(self, rects):\n        return [i for i, r in enumerate(rects) if self.colliderect(r)]\n\n    def __iter__(self):\n        return iter((self.x, self.y, self.w, self.h))\n\n    def __len__(self):\n        return 4\n\n    def __getitem__(self, i):\n        return (self.x, self.y, self.w, self.h)[i]\n\n    def __eq__(self, o):\n        try:\n            return tuple(self) == tuple(Rect(o))\n        except TypeError:\n            return NotImplemented\n\n    def __repr__(self):\n        return \"<rect(%s, %s, %s, %s)>\" % (self.x, self.y, self.w, self.h)\n\n\nZRect = Rect\n\n\n# ---------- keys, keyboard, mouse ----------\nclass _Code(int):\n    \"\"\"A key or a mouse button, like the members of Pygame Zero's keys and mouse:\n    the same number as pygame (keys.A == 97), a name (key.name == \"A\"), printed as the number.\"\"\"\n    def __new__(cls, value, group, name):\n        o = int.__new__(cls, value)\n        o.name = name\n        o._label = group + \".\" + name\n        return o\n\n    @property\n    def value(self):\n        return int(self)\n\n    def __repr__(self):\n        return \"<%s: %d>\" % (self._label, int(self))\n\n    def __str__(self):\n        return str(int(self))\n\n\n# pygame's key codes (SDL 2), so that keys.A == 97 and chr(key) give the same results as on a computer\n_KEYCODES = {\"UNKNOWN\": 0, \"BACKSPACE\": 8, \"TAB\": 9, \"RETURN\": 13, \"ESCAPE\": 27, \"SPACE\": 32, \"PLUS\": 43, \"COMMA\": 44,\n             \"MINUS\": 45, \"PERIOD\": 46, \"SLASH\": 47, \"EQUALS\": 61, \"DELETE\": 127,\n             \"INSERT\": 1073741897, \"HOME\": 1073741898, \"PAGEUP\": 1073741899, \"END\": 1073741901, \"PAGEDOWN\": 1073741902,\n             \"RIGHT\": 1073741903, \"LEFT\": 1073741904, \"DOWN\": 1073741905, \"UP\": 1073741906,\n             \"LCTRL\": 1073742048, \"LSHIFT\": 1073742049, \"LALT\": 1073742050, \"RCTRL\": 1073742052, \"RSHIFT\": 1073742053,\n             \"RALT\": 1073742054}\nfor _i in range(10):\n    _KEYCODES[\"K_%d\" % _i] = 48 + _i\nfor _c in \"abcdefghijklmnopqrstuvwxyz\":\n    _KEYCODES[_c.upper()] = ord(_c)\nfor _i in range(1, 13):\n    _KEYCODES[\"F%d\" % _i] = 1073741881 + _i\n\n# key names as the app sends them (KeyboardEvent.key, lowercased) -> names of Pygame Zero's keys\n_KEYNAMES = {\"arrowleft\": \"LEFT\", \"arrowright\": \"RIGHT\", \"arrowup\": \"UP\", \"arrowdown\": \"DOWN\", \" \": \"SPACE\",\n             \"enter\": \"RETURN\", \"escape\": \"ESCAPE\", \"backspace\": \"BACKSPACE\", \"tab\": \"TAB\", \"delete\": \"DELETE\",\n             \"shift\": \"LSHIFT\", \"rshift\": \"RSHIFT\", \"control\": \"LCTRL\", \"alt\": \"LALT\", \"home\": \"HOME\", \"end\": \"END\",\n             \"pageup\": \"PAGEUP\", \"pagedown\": \"PAGEDOWN\", \"insert\": \"INSERT\",\n             \"+\": \"PLUS\", \"-\": \"MINUS\", \".\": \"PERIOD\", \",\": \"COMMA\", \"/\": \"SLASH\", \"=\": \"EQUALS\"}\nfor _c in \"abcdefghijklmnopqrstuvwxyz\":\n    _KEYNAMES[_c] = _c.upper()\nfor _c in \"0123456789\":\n    _KEYNAMES[_c] = \"K_\" + _c\nfor _i in range(1, 13):\n    _KEYNAMES[\"f%d\" % _i] = \"F%d\" % _i\n\nkeys = types.SimpleNamespace()\n_KEYS = {}\nfor _name, _code in _KEYCODES.items():\n    _KEYS[_name] = _Code(_code, \"keys\", _name)\n    setattr(keys, _name, _KEYS[_name])\n\nkeymods = types.SimpleNamespace(LSHIFT=1, RSHIFT=2, SHIFT=3, LCTRL=64, RCTRL=128, CTRL=192, LALT=256, RALT=512,\n                                ALT=768)\nmouse = types.SimpleNamespace(LEFT=_Code(1, \"mouse\", \"LEFT\"), MIDDLE=_Code(2, \"mouse\", \"MIDDLE\"),\n                              RIGHT=_Code(3, \"mouse\", \"RIGHT\"), WHEEL_UP=_Code(4, \"mouse\", \"WHEEL_UP\"),\n                              WHEEL_DOWN=_Code(5, \"mouse\", \"WHEEL_DOWN\"))\n_BUTTONS = {1: mouse.LEFT, 2: mouse.MIDDLE, 3: mouse.RIGHT, 4: mouse.WHEEL_UP, 5: mouse.WHEEL_DOWN}\n\n\nclass Keyboard:\n    \"\"\"keyboard.left, keyboard.a, keyboard[keys.SPACE]: True while the key is held down.\"\"\"\n    def __init__(self):\n        object.__setattr__(self, \"_down\", set())\n\n    def __getattr__(self, name):\n        if name.startswith(\"_\"):\n            raise AttributeError(name)\n        k = _KEYS.get(name.upper())\n        if k is None:\n            raise AttributeError(\"keyboard has no key called %r\" % name)\n        return k in self._down\n\n    def __getitem__(self, k):\n        return k in self._down\n\n    def __setattr__(self, name, value):\n        raise AttributeError(\"keyboard can't be changed: it tells which keys are held down\")\n\n\n# ---------- clock ----------\nclass Clock:\n    \"\"\"clock.schedule(f, 2) calls f in 2 seconds, clock.schedule_interval(f, 0.5) every half second.\"\"\"\n    def __init__(self):\n        self.t = 0.0\n        self._ev = []      # [due, seq, callback, interval or None]\n        self._seq = 0\n\n    def _add(self, cb, delay, interval):\n        if not callable(cb):\n            raise TypeError(\"the clock needs a function to call, not %s\" % type(cb).__name__)\n        self._seq += 1\n        self._ev.append([self.t + _num(delay, \"delay\"), self._seq, cb, interval])\n\n    def schedule(self, callback, delay):\n        self._add(callback, delay, None)\n\n    def schedule_unique(self, callback, delay):\n        self.unschedule(callback)\n        self._add(callback, delay, None)\n\n    def schedule_interval(self, callback, interval):\n        if _num(interval, \"interval\") <= 0:\n            raise ValueError(\"the interval must be more than 0 seconds\")\n        self._add(callback, interval, interval)\n\n    def unschedule(self, callback):\n        self._ev = [e for e in self._ev if e[2] != callback]\n\n    def next_in(self):\n        \"\"\"Seconds until the next call, or None when nothing is scheduled.\"\"\"\n        return max(0.0, min(e[0] for e in self._ev) - self.t) if self._ev else None\n\n    def tick(self, dt):\n        \"\"\"Moves time on and calls what's due, in order; returns how many calls were made.\"\"\"\n        self.t += dt\n        fired = 0\n        while fired < 1000:\n            due = [e for e in self._ev if e[0] <= self.t + 1e-9]\n            if not due:\n                break\n            e = min(due, key=lambda e: (e[0], e[1]))\n            if e[3] is None:\n                self._ev.remove(e)\n            else:\n                e[0] += e[3]\n                self._seq += 1\n                e[1] = self._seq\n            e[2]()\n            fired += 1\n        return fired\n\n\n# ---------- screen ----------\n_ANCHORS = (\"topleft\", \"midtop\", \"topright\", \"midleft\", \"center\", \"midright\", \"bottomleft\", \"midbottom\",\n            \"bottomright\")\n_IGNORED = {\"fontname\", \"sysfontname\", \"antialias\", \"bold\", \"italic\", \"underline\", \"gcolor\", \"surf\", \"cache\"}\n\n\ndef _text_opts(kw, where):\n    \"\"\"ptext's options as the app paints them: colour, size, background, alignment and effects.\"\"\"\n    c = color\n    o = {\"c\": c(kw.pop(\"color\", \"white\")), \"s\": _num(kw.pop(\"fontsize\", 24), \"fontsize\")}\n    bg = kw.pop(\"background\", None)\n    if bg is not None:\n        o[\"bg\"] = c(bg)\n    align = kw.pop(\"align\", None)   # by default the lines line up on the anchor's side\n    if align is not None:\n        if align not in (\"left\", \"center\", \"right\"):\n            raise ValueError(\"align must be 'left', 'center' or 'right', not %r\" % (align,))\n        o[\"al\"] = align\n    o[\"lh\"] = _num(kw.pop(\"lineheight\", 1.0), \"lineheight\")\n    width = kw.pop(\"width\", None)\n    if width is not None:\n        o[\"w\"] = _num(width, \"width\")\n    if \"alpha\" in kw:\n        o[\"a\"] = max(0.0, min(1.0, float(_num(kw.pop(\"alpha\"), \"alpha\"))))\n    owidth, ocolor = kw.pop(\"owidth\", None), kw.pop(\"ocolor\", \"black\")\n    if owidth:\n        o[\"ow\"], o[\"oc\"] = _num(owidth, \"owidth\"), c(ocolor)\n    shadow, scolor = kw.pop(\"shadow\", None), kw.pop(\"scolor\", \"black\")\n    if shadow:\n        o[\"sh\"], o[\"sc\"] = _point(shadow, \"shadow\"), c(scolor)\n    angle = kw.pop(\"angle\", 0)\n    if angle:\n        o[\"an\"] = _num(angle, \"angle\")\n    for k in list(kw):\n        if k in _IGNORED:\n            kw.pop(k)\n    if kw:\n        raise TypeError(\"%s() got an unexpected keyword argument %r\" % (where, next(iter(kw))))\n    return o\n\n\nclass _Draw:\n    def __init__(self, screen):\n        self._s = screen\n\n    def _w(self, width):\n        width = _num(width, \"width\")\n        if width < 0:\n            raise ValueError(\"the width of a line can't be negative\")\n        return width\n\n    def line(self, start, end, color_, width=1):\n        self._s._add([\"line\"] + _point(start, \"start\") + _point(end, \"end\") + [color(color_), self._w(width)])\n\n    def circle(self, pos, radius, color_, width=1):\n        self._s._add([\"circle\"] + _point(pos) + [_num(radius, \"radius\"), color(color_), False, self._w(width)])\n\n    def filled_circle(self, pos, radius, color_):\n        self._s._add([\"circle\"] + _point(pos) + [_num(radius, \"radius\"), color(color_), True, 0])\n\n    # like Pygame Zero, rect() and filled_rect() want a Rect, not a tuple\n    def rect(self, rect, color_, width=1):\n        if not isinstance(rect, Rect):\n            raise TypeError(\"screen.draw.rect() requires a rect to draw\")\n        self._s._add([\"rect\", rect.x, rect.y, rect.w, rect.h, color(color_), False, self._w(width)])\n\n    def filled_rect(self, rect, color_):\n        if not isinstance(rect, Rect):\n            raise TypeError(\"screen.draw.filled_rect() requires a rect to draw\")\n        self._s._add([\"rect\", rect.x, rect.y, rect.w, rect.h, color(color_), True, 0])\n\n    def polygon(self, points, color_, width=1):\n        self._s._add([\"poly\", [_point(p, \"point\") for p in points], color(color_), False, self._w(width)])\n\n    def filled_polygon(self, points, color_):\n        self._s._add([\"poly\", [_point(p, \"point\") for p in points], color(color_), True, 0])\n\n    def text(self, text, pos=None, **kw):\n        anchor, point = \"topleft\", pos\n        for k in _ANCHORS:\n            if k in kw:\n                anchor, point = k, kw.pop(k)\n        if point is None:\n            point = (0, 0)\n        self._s._add([\"text\", str(text)] + _point(point) + [anchor, _text_opts(kw, \"text\")])\n\n    def textbox(self, text, rect, **kw):\n        r = rect if isinstance(rect, Rect) else Rect(rect)\n        self._s._add([\"textbox\", str(text), r.x, r.y, r.w, r.h, _text_opts(kw, \"textbox\")])\n\n\nclass Screen:\n    \"\"\"The game window: screen.fill, screen.clear and screen.draw.<shape>.\"\"\"\n    def __init__(self, width, height):\n        self.width, self.height = width, height\n        self.draw = _Draw(self)\n        self.cmds = []\n\n    def _add(self, cmd):\n        self.cmds.append(cmd)\n\n    def bounds(self):\n        return Rect(0, 0, self.width, self.height)\n\n    def fill(self, color_, gcolor=None):\n        c = color(color_)\n        # everything drawn before in this step is covered: no need to send it\n        self.cmds = [[\"fill\", c, None if gcolor is None else color(gcolor)]]\n\n    def clear(self):\n        self.cmds = [[\"fill\", \"#000000\", None]]\n\n    def blit(self, *a, **k):\n        raise NotImplementedError(\"images aren't available in Arcode yet: draw with screen.draw\")\n\n\nclass _Missing:\n    def class _NeedInput(BaseException):
    pass


_st = {"skip": 0, "pos": 0, "out": [], "inputs": [], "need": None, "silent": False, "images": 0}


def _emit(kind, s):
    n = 1 if kind == "img" else len(s)
    start = _st["pos"]
    _st["pos"] = start + n
    if kind == "out":
        _st["out"].append(s)
    elif kind == "img":
        _st["images"] += 1
    if _st["silent"] or _st["pos"] <= _st["skip"]:
        return
    if kind != "img" and start < _st["skip"]:
        s = s[_st["skip"] - start:]
    ppEmit(kind, s)


class _Stream(io.TextIOBase):
    def __init__(self, kind):
        super().__init__()
        self._kind = kind

    def writable(self):
        return True

    def write(self, s):
        s = str(s)
        if s:
            _emit(self._kind, s)
        return len(s)

    def flush(self):
        pass

    def isatty(self):
        return False

    @property
    def encoding(self):
        return "utf-8"


sys.stdout = _Stream("out")
sys.stderr = _Stream("err")


def _input(prompt=""):
    prompt = str(prompt)
    if prompt:
        _emit("prompt", prompt)
    if _st["inputs"]:
        v = _st["inputs"].pop(0)
        _emit("echo", v + "\n")
        return v
    _st["need"] = prompt
    raise _NeedInput()

_RUNNER_FILE = _input.__code__.co_filename


def _fresh_ns():

def _pp_show(*args, **kwargs):
    import matplotlib.pyplot as plt
    for num in plt.get_fignums():
        fig = plt.figure(num)
        buf = io.BytesIO()
        fig.savefig(buf, format="png", dpi=110, bbox_inches="tight")
        _emit("img", base64.b64encode(buf.getvalue()).decode("ascii"))
    plt.close("all")

    try:
        import matplotlib
        matplotlib.use("agg")

        plt.show = _pp_show

        pass


def _format_error(e, filename):
    name = type(e).__name__
    if isinstance(e, SyntaxError):
        text = "".join(traceback.format_exception_only(type(e), e))
        line = e.lineno if e.filename == filename else None
        return text, name, line
    tb = e.__traceback__
    while tb is not None and tb.tb_frame.f_code.co_filename != filename:
        tb = tb.tb_next
    if tb is None:
        tb = e.__traceback__
    te = traceback.TracebackException(type(e), e, tb)
    # Pygame Zero's lines and the runner's own don't help the learner: the traceback ends at their line
    te.stack = traceback.StackSummary.from_list([f for f in te.stack if f.filename not in (_PGZ_FILE, _RUNNER_FILE)])
    text = "".join(te.format())
    line = None
    t = tb
    while t is not None:
        if t.tb_frame.f_code.co_filename == filename:
            line = t.tb_lineno
        t = t.tb_next
    return text, name, line


# The hidden tests of the games load the dice (random.randint = ...): the module is shared between runs,
# so the original functions are put back before every program and after every test
_RANDOM_ORIG = {k: getattr(random, k) for k in ("randint", "randrange", "choice", "choices", "random", "uniform", "shuffle", "sample", "seed")}


def _restore_random():
    for k, v in _RANDOM_ORIG.items():
        setattr(random, k, v)


def _pp_reset():
    global _ns, _game
    _ns = _fresh_ns()
    _game = None


# The game whose window is open: the program has run, and the app now asks for one step at a time (_pp_frame)
_game = None
_game_file = None


def _game_hint(ns, src, game):
    """Why a game didn't open its window: pgzrun.go() is missing at the end, or import pgzrun at the top."""
    if game is not None:
        return "go"
    f = ns.get("draw")
    if isinstance(f, types.FunctionType) and f.__code__.co_argcount == 0 and "screen." in src:
        return "import"
    return None


def _pp_run(payload):
    global _ns, _game, _game_file
    _game = None
    p = json.loads(payload)
    src, filename, mode = p["src"], p["filename"], p["mode"]
    _st.update(skip=int(p.get("skip") or 0), pos=0, out=[], inputs=list(p.get("inputs") or []),
               need=None, silent=bool(p.get("silent")), images=0)
    linecache.cache[filename] = (len(src), None, src.splitlines(True), filename)
    if mode != "repl":
        _restore_random()
    if p.get("seed") is not None:
        random.seed(p["seed"])
    if mode == "repl":
        ns = _ns
    else:
        ns = _fresh_ns()
        plt = sys.modules.get("matplotlib.pyplot")
        if plt is not None:
            plt.close("all")
    # import pgzrun gives the program Pygame Zero's names; pgzrun.go() opens the window after the last line
    game = None
    if mode != "repl" and re.search(r"\b(pgzrun|pgzero)\b", src):
        game = _pgz().Game(ns)
        game.install()
    status, err, info, hint = "ok", None, None, None
    try:
        if mode == "repl":
            tree = ast.parse(src, filename, "exec")
            last = None
            if tree.body and isinstance(tree.body[-1], ast.Expr):
                last = ast.Expression(tree.body.pop().value)
            if tree.body:
                exec(compile(tree, filename, "exec"), ns)
            if last is not None:
                value = eval(compile(last, filename, "eval"), ns)
                if value is not None:
                    builtins._ = value
                    print(repr(value))
        else:
            exec(compile(src, filename, "exec"), ns)
    except _NeedInput:
        status = "need_input"
    except SystemExit:
        pass
    except BaseException as e:
        status = "error"
        err = _format_error(e, filename)
    if _st["need"] is not None:
        status = "need_input"
    if mode == "file" and status == "ok":
        if game is not None and game.started:
            try:
                info = game.setup()
                status, _game, _game_file = "game", game, filename
            except Exception as e:
                status, err = "error", _format_error(e, filename)
        else:
            hint = _game_hint(ns, src, game)
    if mode == "file" and status != "need_input":
        _ns = ns
    if mode == "test":
        _restore_random()
    res = {"status": status, "out": "".join(_st["out"]), "pos": _st["pos"], "images": _st["images"]}
    if status == "need_input":
        res["prompt"] = _st["need"]
    if err:
        res["tb"], res["name"], res["line"] = err
    if info:
        res["game"] = info
    if hint:
        res["hint"] = hint
    return json.dumps(res)


def _pp_frame(payload):
    """One step of the open game: the app sends the time passed and the keys and clicks, and gets the drawing."""
    global _game
    p = json.loads(payload)
    _st.update(skip=0, pos=0, out=[], inputs=[], need=None, silent=False, images=0)
    g = _game
    if g is None:
        return json.dumps({"status": "quit", "cmds": [], "out": "", "wait": -1})
    status, err, cmds = "ok", None, []
    try:
        cmds, alive = g.step(float(p.get("dt") or 0), p.get("events") or [])
        if not alive:
            status = "quit"
    except _NeedInput as e:
        r = RuntimeError("input() can't wait for an answer while the game is running: read the keys with on_key_down()")
        r.__traceback__ = e.__traceback__
        status, err, cmds = "error", _format_error(r, _game_file), g.screen.cmds
    except BaseException as e:
        status, err, cmds = "error", _format_error(e, _game_file), g.screen.cmds
    res = {"status": status, "cmds": cmds, "out": "".join(_st["out"]), "wait": g.wait()}
    if err:
        res["tb"], res["name"], res["line"] = err
    if status != "ok":
        _game = None
    return json.dumps(res)

      self.postMessage({ t: "ready", version: String(ver) });
    } else if (m.t === "run") {
      const say = (s) => { if (!m.silent) self.postMessage({ t: "pkg", text: String(s) }); };
      try { await py.loadPackagesFromImports(m.src, { messageCallback: say, errorCallback: say }); }
      catch (err) { say(errText(err)); }
      if (/matplotlib/.test(m.src)) prepMpl();
      const out = runFn(JSON.stringify(m));
      self.postMessage({ t: "done", id: m.id, res: JSON.parse(String(out)) });
    } else if (m.t === "frame") {
      /* one step of a Pygame Zero game: the page sends time and input, gets back what to draw */
      self.postMessage({ t: "done", id: m.id, res: JSON.parse(String(frameFn(JSON.stringify(m)))) });
    } else if (m.t === "reset") {
      resetFn();
      self.postMessage({ t: "done", id: m.id, res: { status: "ok" } });
    } else if (m.t === "pip") {
      await py.loadPackage("micropip", { messageCallback: () => {} });
      await py.runPythonAsync("import micropip\nawait micropip.install(" + JSON.stringify(m.pkgs) + ")");
      self.postMessage({ t: "done", id: m.id, res: { status: "ok" } });
    }
  } catch (err) {
    if (m.t === "init") self.postMessage({ t: "fail", error: errText(err) });
    else self.postMessage({ t: "done", id: m.id, res: { status: "error", tb: errText(err) + "\n", name: "Error", line: null, out: "", pos: 0, images: 0 } });
  }
};

<script>/* ================= Course: the Python world (content only, no DOM access) =================
   Every level teaches one or two ideas and uses them right away. Each folder has the same rhythm:
   lessons, a "predict" quiz, a review that mixes old and new, a "build" level (one game that grows
   folder after folder) and a boss to debug. Kinds: "code" (default), "quiz", "order" (put the lines
   in order and set the indentation). Hints come in two steps: a question, then the plan in words. */
const COURSE_VER = 6;
/* Levels whose task changed in a version: saved drafts and attempts of these levels are dropped (stars stay) */
const COURSE_CHANGED = { 3: ["build2", "build3", "build4", "build5", "final", "list", "mod", "types"], 4: ["rules", "try", "update"], 5: ["build4", "build5", "final"], 6: ["str"] };

/* Python's int() accepts spaces around the number, a sign and _ between digits */
const isIntText = (s) => /^\s*[-+]?\d+(_\d+)*\s*$/.test(String(s));
const toInt = (s) => parseInt(String(s).replace(/_/g, ""), 10);
/* The learner's program with another value in place of the first match (null if the match isn't there) */
const swapRe = (c, re, to) => (re.test(c) ? c.replace(re, to) : null);
/* A hidden test; dropped when the program doesn't contain what the test needs to change */
const tcase = (code, ok, desc, extra) => (code == null ? null : Object.assign({ code, ok, desc }, extra || {}));
const tlist = (...xs) => xs.filter(Boolean);
const lastLines = (o, n) => o.split("\n").slice(-n).join("\n");
/* The tests of the games load fixed dice: random.randint gives a known number */
const RIG = (expr) => `import random\nrandom.randint = lambda a, b: ${expr}\n`;
/* A hidden test of a Pygame Zero game: the learner's program, then lines that play it without a screen through
   _t = pgzrun._tester(): _t.step(n), _t.hold("right", 10), _t.tap("space"), _t.click((x, y)), _t.wait(1), then
   _t.var("x"), _t.texts(), _t.rects("red"), _t.circles(), _t.over... and print what the check looks at.
   What the game itself prints goes to _t.printed, and what the program prints before the game starts is cut
   off at a marker: ok() only sees the check's own lines. */
const GT_MARK = "~~ arcode: il gioco parte ~~";
const GT_PRE = `\nimport pgzrun as _pz\n_t = _pz._tester()\nprint(${JSON.stringify(GT_MARK)})\n`;
const afterMark = (o) => { const i = o.lastIndexOf(GT_MARK); return i < 0 ? "" : o.slice(i + GT_MARK.length).replace(/^\n/, ""); };
const gtcase = (c, script, ok, desc, extra) => tcase(c == null ? null : c.replace(/\s*$/, "\n") + GT_PRE + script,
  (o) => ok(afterMark(o)), desc, Object.assign({ game: true }, extra || {}));

/* ---------- "Indovina il numero": one game that grows over nine parts, a small step each ----------
   1 one guess, distance and points · 2 a verdict, out of range gives 0 points · 3 up to 5 attempts in a loop,
   points from the attempts · 4 verdict and points become functions · 5 the game itself becomes a function
   (4 and 5 print exactly what 3 prints) · 6 a random secret, non-numbers asked again · 7 levels · 8 a player
   object with the record · 9 more games in a row.
   runGame says what a part prints for a list of answers (prompts excluded, like the app's output). */
const GAME_PART = {
  3: {}, 4: {}, 5: {},
  6: { random: true, nan: true },
  7: { random: true, nan: true, levels: true },
  8: { random: true, nan: true, levels: true, record: true },
  9: { random: true, nan: true, levels: true, record: true, replay: true }
};
const GAME_MAX = 5;
const gamePoints = (t) => 10 * (GAME_MAX + 1 - t);
const GAME = {
  it: {
    hello10: (n) => `Ciao ${n}! Ho un numero segreto da 1 a 10.`, hello: (n) => `Ciao ${n}!`, range: (m) => `Ho un numero segreto da 1 a ${m}.`,
    out: (m) => `Fuori dal campo: scegli da 1 a ${m}!`, win: "Indovinato!", low: "Troppo basso!", high: "Troppo alto!", nan: "Scrivi un numero!",
    reveal: (n, s) => `Hai scelto ${n}, il segreto era ${s}.`, dist: (d, p) => `Distanza: ${d}, punti: ${p}`,
    won: (t, p) => `Ce l'hai fatta! Tentativi: ${t}, punti: ${p}`, lost: (s) => `Tentativi finiti! Il segreto era ${s}. Punti: 0`,
    record: "Nuovo record!", yes: "si", summary: (n, g, r) => `${n}, partite giocate: ${g}. Record: ${r} punti`,
    levels: { facile: 10, medio: 50, difficile: 100 }
  },
  en: {
    hello10: (n) => `Hi ${n}! I have a secret number from 1 to 10.`, hello: (n) => `Hi ${n}!`, range: (m) => `I have a secret number from 1 to ${m}.`,
    out: (m) => `Out of range: pick from 1 to ${m}!`, win: "You got it!", low: "Too low!", high: "Too high!", nan: "Type a number!",
    reveal: (n, s) => `You chose ${n}, the secret was ${s}.`, dist: (d, p) => `Distance: ${d}, points: ${p}`,
    won: (t, p) => `You made it! Attempts: ${t}, points: ${p}`, lost: (s) => `Out of attempts! The secret was ${s}. Points: 0`,
    record: "New record!", yes: "yes", summary: (n, g, r) => `${n}, games played: ${g}. Record: ${r} points`,
    levels: { easy: 10, medium: 50, hard: 100 }
  }
};
/* end: "done" (the program finished), "more" (it would ask for more answers), "extra" (it finished, but the
   answers were more: the program asked too many questions), "crash" (int() of a non-number before part 6),
   "bad" (secret out of range), "cut" (stopped after maxGames games) */
function runGame(lang, part, ins, secretFor, maxGames) {
  const T = GAME[lang], lines = [], res = (end) => ({ lines, end });
  if (!ins.length) return res("more");
  const name = ins[0];
  if (part <= 2) {
    if (ins.length < 2) return res("more");
    if (!isIntText(ins[1])) return res("crash");
    const n = toInt(ins[1]), d = Math.abs(7 - n);
    let p = 10 - d;
    lines.push(T.hello10(name));
    if (part === 2) {
      if (n < 1 || n > 10) { lines.push(T.out(10)); p = 0; }
      else lines.push(n === 7 ? T.win : n < 7 ? T.low : T.high);
    }
    lines.push(T.reveal(n, 7), T.dist(d, p));
    return res(ins.length === 2 ? "done" : "extra");
  }
  const P = GAME_PART[part];
  lines.push(P.levels ? T.hello(name) : T.hello10(name));
  let i = 1, games = 0, record = 0;
  for (;;) {
    let top = 10;
    if (P.levels) {
      if (i >= ins.length) return res("more");
      const lv = ins[i++];
      top = Object.prototype.hasOwnProperty.call(T.levels, lv) ? T.levels[lv] : 10;
      lines.push(T.range(top));
    }
    const secret = secretFor(games, top);
    if (!(secret >= 1 && secret <= top)) return res("bad");
    let t = 0, won = false;
    while (t < GAME_MAX) {
      if (i >= ins.length) return res("more");
      const x = ins[i++];
      if (!isIntText(x)) { if (!P.nan) return res("crash"); lines.push(T.nan); continue; }
      const n = toInt(x);
      t++;
      if (n < 1 || n > top) lines.push(T.out(top));
      else if (n === secret) { lines.push(T.win); won = true; break; }
      else lines.push(n < secret ? T.low : T.high);
    }
    const points = won ? gamePoints(t) : 0;
    lines.push(won ? T.won(t, points) : T.lost(secret));
    games++;
    if (!P.record) return res(i === ins.length ? "done" : "extra");
    if (points > record) { record = points; lines.push(T.record); }
    if (!P.replay) break;
    if (i >= ins.length) return res("more");
    if (ins[i++] !== T.yes) break;
    if (maxGames && games >= maxGames) return res("cut");
  }
  lines.push(T.summary(name, games, record));
  return res(i === ins.length ? "done" : "extra");
}
/* What the program should have printed. Up to part 5 the secret is 7; from part 6 it's random, so for each
   game it takes the secret that fits the output best (the right one, when the program works). */
function gameExpect(lang, part, ins, out) {
  if (!(GAME_PART[part] || {}).random) { const r = runGame(lang, part, ins || [], () => 7); return r.end === "done" ? r.lines.join("\n") : null; }
  const want = String(out || "").split("\n"), chosen = [];
  for (let k = 0; k < 40; k++) {
    let best = null;
    for (let s = 1; s <= 100; s++) {
      const r = runGame(lang, part, ins || [], (j) => (j < k ? chosen[j] : s), k + 1);
      if (r.end !== "done" && r.end !== "cut") continue;
      let same = 0;
      while (same < r.lines.length && r.lines[same] === want[same]) same++;
      if (!best || same > best.same) best = { s, same, r };
      if (same === r.lines.length) break;
    }
    if (!best) return null;
    chosen.push(best.s);
    if (best.r.end === "done") return best.r.lines.join("\n");
  }
  return null;
}
/* The output with the loaded dice of the tests: random.randint(1, top) gives top // 2 */
const gameRigged = (lang, part, ins) => { const r = runGame(lang, part, ins, (k, top) => Math.floor(top / 2)); return r.end === "done" ? r.lines.join("\n") : null; };
const gameCheck = (lang, part, needs) => (o, c, x) => needs.every((re) => re.test(c)) && o === gameExpect(lang, part, x.inputs, o);
/* Hidden tests: whole games with other answers (with loaded dice from part 6) */
const gameTests = (lang, part, games) => (c) => games.map((ins) => {
  const rand = !!(GAME_PART[part] || {}).random;
  const want = rand ? gameRigged(lang, part, ins) : gameExpect(lang, part, ins);
  const end = want.split("\n").pop();
  return tcase(rand ? RIG("b // 2") + c : c, (o) => o === want,
    lang === "it" ? `con le risposte ${ins.join(", ")} doveva finire con ${end}` : `with the answers ${ins.join(", ")} it had to end with ${end}`,
    rand ? { inputs: ins, rand: true } : { inputs: ins });
});

/* Business card: free content, fixed shape. Returns what is still missing, or null. */
function buildCardWhy(o, c, lang) {
  const it = lang === "it", r = o.split("\n").filter((l) => l.trim());
  const frame = (s) => s.trim().length >= 3 && /^[^A-Za-z0-9À-ÿ\s]+$/.test(s.trim());
  const firstCode = (c.trim().split("\n")[0] || "").trim();
  if (r.length < 4) return it ? "Il biglietto deve avere almeno 4 righe." : "The card needs at least 4 lines.";
  if (!frame(r[0]) || !frame(r[r.length - 1])) return it ? "La prima e l'ultima riga devono essere fatte solo di simboli, almeno 3." : "The first and last lines must be made only of symbols, at least 3.";
  if (!r.slice(1, -1).some((l) => /[A-Za-zÀ-ÿ]/.test(l))) return it ? "In mezzo ci vuole il tuo nome." : "Your name has to be in the middle.";
  if (!/print\s*\(\s*[\d.]+\s*[-+*/]\s*[\d.]+/.test(c)) return it ? "Manca un numero calcolato da Python, come print(2026 + 1)." : "A number worked out by Python is missing, like print(2026 + 1).";
  if (!/^#/.test(firstCode)) return it ? "Il programma deve cominciare con un commento che dice di chi è il biglietto." : "The program must start with a comment saying whose card it is.";
  return null;
}

if x > 4:

if x > 3:
    print("A")
elif x > 4:
    print("B")
else:

if x > 4:

if x > 3:

elif x > 4:

else:

if x > 3:

elif x > 1:

else:

<p>Con più tentativi non puoi più svelare il segreto dopo ogni numero: togli le due righe con il segreto e la distanza. Cambiano anche i punti: ora dipendono dai tentativi usati, <code>10 * (6 - tentativi)</code>. Al primo colpo fai 50 punti, al quinto 10.</p>
<pre class="term-sample">Come ti chiami? Ada
Ciao Ada! Ho un numero segreto da 1 a 10.
Il tuo numero? 4
Troppo basso!
Il tuo numero? 9
Troppo alto!

Indovinato!

    solution: `segreto = 7

<p>Le variabili create dentro una funzione, come i suoi parametri, sono <b>locali</b>: esistono solo mentre la funzione lavora, e fuori non si vedono. Quello che serve fuori esce con <code>return</code>.</p>`,

    title: "Costruisci: indovina il numero, parte 4",
    theory: [
`<p>Parte 4: il gioco è cresciuto, ed è ora di metterlo in ordine con le <b>funzioni</b>. Per chi gioca non cambia niente: l'output resta identico. Cambia per chi legge il codice, che si divide in pezzi con un nome e un compito solo. In questa parte ne crei due:</p>
<ul><li><code>verdetto(n, segreto)</code> <b>restituisce</b> la frase del verdetto, invece di stamparla: nel ciclo la catena di <code>if</code> diventa una riga sola, che stampa quello che la funzione restituisce;</li>
<li><code>punti_per(tentativi)</code> restituisce i punti, e la riga del risultato la usa.</li></ul>
<p>Il <code>break</code> resta nel ciclo, perché una funzione non può far uscire dal ciclo chi la chiama: dopo aver stampato il verdetto, controlla tu se il numero è giusto.</p>
<p>I parametri possono chiamarsi come le variabili di fuori, per esempio <code>segreto</code> e <code>tentativi</code>: dentro la funzione sono variabili locali, e valgono i valori che la funzione riceve.</p>`],
    task: `Crea le funzioni <code>verdetto</code> e <code>punti_per</code>, con questi nomi, e usale nel gioco senza cambiare quello che stampa. Proverò anche le funzioni da sole e una partita con un altro segreto.`,
    solution: `segreto = 7
max_tentativi = 5
tentativi = 0

def verdetto(n, segreto):
    if n < 1 or n > 10:
        return "Fuori dal campo: scegli da 1 a 10!"
    elif n == segreto:
        return "Indovinato!"
    elif n < segreto:
        return "Troppo basso!"
    return "Troppo alto!"

def punti_per(tentativi):
    return 10 * (max_tentativi + 1 - tentativi)

nome = input("Come ti chiami? ")
print(f"Ciao {nome}! Ho un numero segreto da 1 a 10.")
while tentativi < max_tentativi:
    tentativo = int(input("Il tuo numero? "))
    tentativi += 1
    print(verdetto(tentativo, segreto))
    if tentativo == segreto:

/* "try": one answer, the year of birth; "retry": ask again until the number of tickets is right */
const yearIn = (lang, ins) => {
  const it = lang === "it", s = (ins || [])[0];
  if (s === undefined || ins.length !== 1) return null;
  const first = isIntText(s) ? (it ? `Nel 2040 avrai ${2040 - toInt(s)} anni` : `In 2040 you'll be ${2040 - toInt(s)}`) : (it ? "Scrivi l'anno in cifre" : "Write the year in digits");
  return first + "\n" + (it ? "Grazie!" : "Thanks!");
};
const tickets = (lang, ins) => {
  const it = lang === "it", out = [];
  for (let k = 0; k < (ins || []).length; k++) {
    const s = ins[k];
    if (!isIntText(s)) { out.push(it ? "Non è un numero, riprova." : "Not a number, try again."); continue; }
    const n = toInt(s);
    if (n >= 1 && n <= 10) { out.push(it ? `Totale: ${n * 5} euro` : `Total: ${n * 5} euros`); return k === ins.length - 1 ? out.join("\n") : null; }
    out.push(it ? "Da 1 a 10, riprova." : "From 1 to 10, try again.");
  }
  return null;
};
const diceWhy = (lang) => (o) => {
  const it = lang === "it", r = o.split("\n");
  if (r.length !== 2) return it ? "Devono uscire esattamente 2 righe: i dadi e chi gioca." : "Exactly 2 lines must come out: the dice and who plays.";
  const m = r[0].match(it ? /^Dadi: ([1-6]) e ([1-6]), totale (\d+)$/ : /^Dice: ([1-6]) and ([1-6]), total (\d+)$/);
  if (!m) return it ? "La prima riga deve essere come Dadi: 3 e 5, totale 8, con due numeri da 1 a 6." : "The first line must be like Dice: 3 and 5, total 8, with two numbers from 1 to 6.";
  if (+m[1] + +m[2] !== +m[3]) return it ? "Il totale non è la somma dei due dadi." : "The total isn't the sum of the two dice.";
  if (!(it ? /^Tocca a (Ada|Bob|Cleo)$/ : /^(Ada|Bob|Cleo)'s turn$/).test(r[1])) return it ? "La seconda riga deve essere Tocca a seguito da uno dei tre nomi." : "The second line must be one of the three names followed by 's turn.";
  return null;
};

<pre class="term-sample">Come ti chiami? Ada

    task: `Fai crescere il gioco con il segreto casuale e la funzione <code>leggi_numero()</code>. Per controllarlo truccherò i dadi: saprò io quale numero esce.`,
    solution: `import random

segreto = random.randint(1, 10)
max_tentativi = 5

def verdetto(n, segreto):
    if n < 1 or n > 10:
        return "Fuori dal campo: scegli da 1 a 10!"
    elif n == segreto:
        return "Indovinato!"
    elif n < segreto:
        return "Troppo basso!"
    return "Troppo alto!"

def punti_per(tentativi):
    return 10 * (max_tentativi + 1 - tentativi)

def leggi_numero():
    while True:
        try:
            return int(input("Il tuo numero? "))
        except ValueError:
            print("Scrivi un numero!")

def partita(segreto):

    while tentativi < max_tentativi:
        tentativo = leggi_numero()
        tentativi += 1

    return 0
