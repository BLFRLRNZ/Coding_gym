`<p>Part 6: two new things that make the game real, with the tools of this folder.</p>
<ul><li>The secret isn't always 7 any more: <code>random.randint(1, 10)</code> picks it, so it changes every game.</li>
<li>If the player types something that isn't a number, the program no longer stops with an error: it says <code>Type a number!</code> and asks again, without counting the attempt. Put that in a function <code>read_number()</code>, which <code>play</code> uses instead of <code>int(input(...))</code>.</li></ul>
<pre class="term-sample">What's your name? Ada
Hi Ada! I have a secret number from 1 to 10.
Your number? five
Type a number!
Your number? 3
Too low!
Your number? 5
You got it!
You made it! Attempts: 2, points: 40</pre>`],
    task: `Grow the game with the random secret and the function <code>read_number()</code>. To check it I'll load the dice: I'll know which number comes up.`,
    solution: `import random

secret = random.randint(1, 10)
max_attempts = 5

def verdict(n, secret):
    if n < 1 or n > 10:
        return "Out of range: pick from 1 to 10!"
    elif n == secret:
        return "You got it!"
    elif n < secret:
        return "Too low!"
    return "Too high!"

def points_for(attempts):
    return 10 * (max_attempts + 1 - attempts)

def read_number():
    while True:
        try:
            return int(input("Your number? "))
        except ValueError:
            print("Type a number!")

def play(secret):
    attempts = 0
    while attempts < max_attempts:
        guess = read_number()
        attempts += 1
        print(verdict(guess, secret))
        if guess == secret:
            return attempts
    return 0

name = input("What's your name? ")
print(f"Hi {name}! I have a secret number from 1 to 10.")
attempts = play(secret)
if attempts > 0:
    print(f"You made it! Attempts: {attempts}, points: {points_for(attempts)}")
else:
    print(f"Out of attempts! The secret was {secret}. Points: 0")`,

`<p>Parte 7: i <b>livelli</b>. Dopo il nome il giocatore sceglie <code>facile</code> (da 1 a 10), <code>medio</code> (da 1 a 50) o <code>difficile</code> (da 1 a 100). Tieni i livelli in un dizionario e prendi il massimo con <code>get</code>: un livello che non esiste vale come facile. Il segreto si sceglie dopo il livello, da 1 al massimo.</p>

    task: `Fai crescere il gioco con i livelli. Per controllarlo truccherò i dadi: saprò io quale numero esce.`,
    solution: `import random

max_tentativi = 5
livelli = {"facile": 10, "medio": 50, "difficile": 100}

def verdetto(n, segreto, massimo):
    if n < 1 or n > massimo:
        return f"Fuori dal campo: scegli da 1 a {massimo}!"

        return "Indovinato!"
    elif n < segreto:
        return "Troppo basso!"
    return "Troppo alto!"

def punti_per(tentativi):
    return 10 * (max_tentativi + 1 - tentativi)

def leggi_numero():

            return int(input("Il tuo numero? "))
        except ValueError:

def partita(segreto, massimo):

    return 0

`<p>Part 7: the <b>levels</b>. After the name the player picks <code>easy</code> (1 to 10), <code>medium</code> (1 to 50) or <code>hard</code> (1 to 100). Keep the levels in a dictionary and take the top with <code>get</code>: a level that doesn't exist counts as easy. The secret is picked after the level, from 1 to the top.</p>
<p>Out of range now depends on the level, so <code>verdict</code> and <code>play</code> also receive the top. The hello splits into two lines, because the level is chosen after the name. The attempts stay 5 at every level: on hard you need some strategy.</p>
<pre class="term-sample">What's your name? Ada
Hi Ada!
Level (easy/medium/hard)? medium
I have a secret number from 1 to 50.
Your number? thirty
Type a number!
Your number? 30
Too high!
Your number? 12
Too low!
Your number? 25
You got it!
You made it! Attempts: 3, points: 30</pre>`],
    task: `Grow the game with the levels. To check it I'll load the dice: I'll know which number comes up.`,
    solution: `import random

max_attempts = 5
levels = {"easy": 10, "medium": 50, "hard": 100}

def verdict(n, secret, top):
    if n < 1 or n > top:
        return f"Out of range: pick from 1 to {top}!"
    elif n == secret:
        return "You got it!"
    elif n < secret:
        return "Too low!"
    return "Too high!"

def points_for(attempts):
    return 10 * (max_attempts + 1 - attempts)

def read_number():
    while True:
        try:
            return int(input("Your number? "))
        except ValueError:
            print("Type a number!")

def play(secret, top):
    attempts = 0
    while attempts < max_attempts:
        guess = read_number()
        attempts += 1
        print(verdict(guess, secret, top))
        if guess == secret:
            return attempts
    return 0

name = input("What's your name? ")
print(f"Hi {name}!")
choice = input("Level (easy/medium/hard)? ")
top = levels.get(choice, 10)
secret = random.randint(1, top)
print(f"I have a secret number from 1 to {top}.")
attempts = play(secret, top)
if attempts > 0:
    print(f"You made it! Attempts: {attempts}, points: {points_for(attempts)}")
else:
    print(f"Out of attempts! The secret was {secret}. Points: 0")`,

<p>Crea il giocatore con il nome scritto e salutalo con <code>giocatore.nome</code>. Dopo la partita metti i punti in una variabile (0 se ha perso) e passali a <code>registra</code>: se è un record, stampa <code>Nuovo record!</code>. Alla fine stampa il riepilogo. Per ora la partita è una sola: nella sfida finale diventeranno tante, e il record avrà davvero senso.</p>

    solution: `import random

max_tentativi = 5
livelli = {"facile": 10, "medio": 50, "difficile": 100}

def verdetto(n, segreto, massimo):
    if n < 1 or n > massimo:
        return f"Fuori dal campo: scegli da 1 a {massimo}!"
    elif n == segreto:
        return "Indovinato!"
    elif n < segreto:
        return "Troppo basso!"
    return "Troppo alto!"

def punti_per(tentativi):
    return 10 * (max_tentativi + 1 - tentativi)

def leggi_numero():
    while True:
        try:
            return int(input("Il tuo numero? "))
        except ValueError:
            print("Scrivi un numero!")

def partita(segreto, massimo):
    tentativi = 0
    while tentativi < max_tentativi:
        tentativo = leggi_numero()
        tentativi += 1
        print(verdetto(tentativo, segreto, massimo))
        if tentativo == segreto:
            return tentativi
    return 0

class Giocatore:
    def __init__(self, nome):
        self.nome = nome
        self.partite = 0
        self.record = 0

    def registra(self, punti):
        self.partite += 1
        if punti > self.record:
            self.record = punti
            return True
        return False

    if (e === "h") { pxPut(F, x - 1, ey + 2, fc); pxPut(F, x, ey + 1, fc); pxPut(F, x + 1, ey + 1, fc); pxPut(F, x + 2, ey + 2, fc); }
    else if (blink) pxRect(F, x, ey + 2, 2, 1, fc);
    else if (e === "t") pxRect(F, x + 1, ey, 2, 2, fc);
    else if (e === "o") { pxRect(F, x, ey, 3, 3, fc); pxPut(F, x + 1, ey + 1, m.pupil || PX_WHITE); }
    else { pxRect(F, x, ey, 2, 3, fc); if (m.hl !== false) pxPut(F, x + 1, ey, PX_WHITE); }
  }
  if (m.ck !== false && (e === "h" || e === "i")) (m.ckp || [[a - 2, ey + 4], [b + 2, ey + 4]]).forEach(([x, y]) => pxRect(F, x, y, 2, 1, PX_PINK));

    const [mx, my] = m.m;
    if (e === "h") { pxRect(F, mx - 2, my, 6, 1, fc); pxPut(F, mx - 1, my + 1, fc); pxRect(F, mx, my + 1, 2, 1, PX_PINK); pxPut(F, mx + 2, my + 1, fc); pxRect(F, mx, my + 2, 2, 1, fc); }
    else if (e === "t") pxRect(F, mx + 1, my + 1, 3, 1, fc);
    else if (e === "o") [[-2, 1], [-1, 0], [0, 1], [1, 0], [2, 1], [3, 0]].forEach(([dx, dy]) => pxPut(F, mx + dx, my + dy, fc));
    else { pxPut(F, mx - 1, my, fc); pxRect(F, mx, my + 1, 2, 1, fc); pxPut(F, mx + 2, my, fc); }
  }
  if (m.extra) m.extra(F, e);
  if (e === "h") { const s = "#f2c14e"; pxPut(F, 33, 3, s); pxPut(F, 32, 3, s); pxPut(F, 34, 3, s); pxPut(F, 33, 2, s); pxPut(F, 33, 4, s); pxPut(F, 35, 7, s); }

  return F;
}

/* Saved progress travels as a file or as a text code */
const SAVE_TAG = "PP3:";
function encodeSave(obj) {
  const json = JSON.stringify({ app: "arcode", v: 3, date: new Date().toISOString(), state: obj });
  const bytes = new TextEncoder().encode(json);
  let bin = ""; bytes.forEach((b) => { bin += String.fromCharCode(b); });
  return SAVE_TAG + btoa(bin);
}
function decodeSave(text) {
  let s = String(text || "").trim();
  let json;
  if (s.startsWith(SAVE_TAG)) {
    const bin = atob(s.slice(SAVE_TAG.length).replace(/\s+/g, ""));
    json = new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0)));
  } else json = s;
  const o = JSON.parse(json);
  if (!o || !["arcode", "palestra-python"].includes(o.app) || !o.state || typeof o.state !== "object") throw new Error("bad save");
  return o;
}

          if (k) { push({ t: "down", key: k.key, mod: 0, unicode: k.u }); setTimeout(() => push({ t: "up", key: k.key, mod: 0 }), 120); }
        }
        return;
      }
      if (!touch.long && !touch.moved && far > 10) {
        clearTimeout(touch.timer);
        touch.moved = true;
        if (touch.ring) { touch.ring.remove(); touch.ring = null; }
        push({ t: "mdown", pos: touch.pos, button: 1 });
      }
      if (touch.moved && moveHook) pushMove(posOf(e));
      return;
    }
    if (moveHook) pushMove(posOf(e));
  });
  const touchEnd = (e, cancel) => {
    if (!touch || e.pointerId !== touch.id) return false;
    clearTimeout(touch.timer);
    const pos = posOf(e), tc = touch;
    touch = null;
    if (tc.ring) { const r = tc.ring; if (tc.long) setTimeout(() => r.remove(), 250); else r.remove(); }
    if (swipeDirs) return true;
    if (tc.long) push({ t: "mup", pos, button: 3 });
    else if (tc.moved) push({ t: "mup", pos, button: 1 });
    else if (!cancel) { push({ t: "mdown", pos: tc.pos, button: 1 }); push({ t: "mup", pos: tc.pos, button: 1 }); }
    return true;
  };
  cv.addEventListener("pointerup", (e) => { if (!touchEnd(e, false)) push({ t: "mup", pos: posOf(e), button: button(e) }); });
  cv.addEventListener("pointercancel", (e) => { touchEnd(e, true); });
  if (mouseHooks) cv.addEventListener("wheel", (e) => {
    e.preventDefault();
    const b = e.deltaY < 0 ? 4 : 5, pos = posOf(e);
    push({ t: "mdown", pos, button: b }); push({ t: "mup", pos, button: b });
  }, { passive: false });
  cv.addEventListener("contextmenu", (e) => e.preventDefault());
  cv.focus({ preventScroll: true });
  if (stageMode === "win") { try { stageEl.scrollIntoView({ block: "nearest" }); } catch (e) {} }

  /* the game loop: a step per frame, at most 60 a second; a game without update() only steps when something happens */
  let last = performance.now(), due = last, wait = 0, wakeAt = 0, r = { status: "ok" };
  for (;;) {
    if (g.paused && !g.stop) {
      await new Promise((ok) => { g.wake = ok; });
      g.wake = null;
      last = due = performance.now();
      continue;
    }
    const now = await new Promise((ok) => { g.wake = ok; requestAnimationFrame(ok); });
    g.wake = null;
    if (g.stop) break;
    if (g.paused || now < due - 2) continue;
    if (g.redraw) { g.redraw = false; g.events.push({ t: "redraw" }); }
    if (wait !== 0 && !g.events.length && (wait < 0 || now < wakeAt)) continue;
    due = Math.max(due + 1000 / GAME_FPS, now - 1000 / GAME_FPS);
    const dt = Math.min(Math.max(now - last, 0) / 1000, wait === 0 ? 0.1 : 1);
    last = now;
    g.sent = performance.now();
    r = await workerCall({ t: "frame", dt, events: g.events.splice(0) }, GAME_STUCK_MS);
    g.sent = 0;
    if (r.cmds && r.cmds.length) { gamePaint(ctx, r.cmds, W, H); g.painted = true; }
    if (r.out && g.out.length < GAME_OUT_KEPT) g.out += r.out;
    gameFlushOut(g);
    if (r.status !== "ok") break;
    wait = r.wait == null ? 0 : r.wait;
    if (wait > 0) wakeAt = performance.now() + wait * 1000;
  }
  gameNow = null;
  g.stop = true;
  /* closing the window ends the program normally (as on a computer): the level's check still runs */
  if (r.status === "ok" || r.status === "quit") stopReq = false;
  gameFlushOut(g);
  hint.hidden = true;
  /* what the game printed goes to the terminal too, after what the program printed before the window */
  if (g.out) termWrite(g.out);
  const base = { out: (res.out || "") + g.out, inputs: res.inputs || [], images: res.images || 0, game: info };
  if (r.status === "error") {
    showStageError(r, fromEditor);
    return Object.assign(base, { status: "error", tb: r.tb, name: r.name, line: r.line });
  }
  if (g.restart && r.status === "ok") { stageLabels(); return Object.assign(base, { status: "restart" }); }
  closeStage();
  if (r.status === "timeout") return Object.assign(base, { status: "timeout", stuck: true });
  if (r.status === "stopped") return Object.assign(base, { status: "stopped" });
  return Object.assign(base, { status: "ok" });
}

async function runFile(src, label, { fromEditor = false, lessonCheck = false, restart = false } = {}) {
  if (!pyReady || running) return null;
  /* a game screen left open (after an error) closes; starting over keeps it, to show the new game */
  if (stageEl && !restart) closeStage();
  lastRun = { src, label, fromEditor, lessonCheck };
  begin(); lastErr = 0;
  if (S.view === "lessons") mascotReact("run");
  newline();
  if (term.childNodes.length) termWrite("\n");
  termWrite("$ python " + label + "\n", "cmd");
  if (engine !== "pyodide" && /\b(pgzrun|pgzero)\b/.test(src)) {
    termWrite(t("gameBasic") + "\n", "fail");
    end(false);
    return "error";
  }
  const t0 = performance.now();
  let res = await engineRun(src, label, "file");
  /* the program ran and called pgzrun.go(): its window opens, until it's closed */
  if (res.status === "game") res = await playGame(res, fromEditor, src);
  else if (stageEl) closeStage();
  if (res.status === "restart") {
    newline(); termWrite(t("gameRestart") + "\n", "dim");
    end(false);
    rerun();
    return "restart";
  }
  const secs = ((performance.now() - t0) / 1000).toFixed(2);
  const status = report(res, "file", fromEditor);
  if (res.stuck) termWrite("→ " + t("gameStuck") + "\n", "why");
  if (status === "ok") termWrite(t("done", secs) + "\n", "dim");
  if (status === "ok" && res.hint) termWrite("→ " + t(res.hint === "go" ? "gameNoGo" : "gameNoImport") + "\n", "why");
  if (lessonCheck && status === "ok") await checkLesson(res, src);
  else if (lessonCheck && status === "error") mascotReact("error");
  else if (S.view === "lessons" && ui.mexpr === "t") mascotReact(null);
  end(false);
  return status;
}
async function runRepl(src, refocus) {
  if (!pyReady || running) return;
  src = fixSmartQuotes(src);
  const word = src.trim().toLowerCase();
  if (!src.includes("\n") && word) { if (hist[hist.length - 1] !== src) hist.push(src); if (hist.length > 100) hist.shift(); }
  histIdx = hist.length; histDraft = "";

  if (tut.active && TUT_SKIP.includes(word)) { tutSkip(); return; }
  if (tut.active && TUT_EXIT.includes(word)) { tutExit(); return; }
  const pip = src.match(/^\s*[!%]?pip3?\s+install\s+(.+)$/);
  if (pip) { runPip(pip[1]); return; }
  if (src.split("\n").every((l) => !l.trim() || l.trim().startsWith("#"))) { showPrompt(); if (refocus) focusPrompt(); return; }
  begin();
  const res = await engineRun(src, "<stdin>", "repl");
  const status = report(res, "repl", false);
  if (tut.active && status !== "stopped") tutOnResult({ src, out: norm(res.out || ""), status: res.status, name: res.name || "" });
  end(refocus);
}
async function runPip(args) {
  begin();

  if (engine !== "pyodide") termWrite(t("pipBasic") + "\n", "fail");

}
async function checkLesson(res, src) {
  const L = lesson();
  const got = norm(res.out || "");
  const ctx = { inputs: res.inputs || [], images: res.images || 0, out: got, src };
  if (!L.check(got, src, ctx)) { explainFail(L, got, src, ctx); mascotReact("fail"); return; }
  /* Hidden tests: the same program with other values or other answers. Tests with loaded dice need the full Python */
  const tests = (L.tests ? L.tests(src) : []).filter((tc) => tc && !(tc.rand && engine !== "pyodide"));
  if (tests.length) {
    termWrite(t(tests.some((tc) => tc.game) ? "testingGame" : "testing") + "\n", "dim");
    for (const tc of tests) {
      const r = await engineRun(tc.code, "test.py", "test", { silent: true, inputs: tc.inputs || [] });
      if (stopReq) return;
      if (r.status !== "ok" || !tc.ok(norm(r.out || ""))) {
        /* a game was played by the check: the messages say so, and a game error gets its explanation */
        const gm = tc.game ? "Game" : "", last = String(r.tb || r.name || "").trim().split("\n").pop();
        newline(); termWrite(t("testFail" + gm, tc.desc) + "\n", "fail");
        const why = r.status === "need_input" ? t("testMoreInput") : r.status === "timeout" ? t("testTimeout" + gm)
          : r.status === "error" ? t("testError" + gm, last) : "";
        if (why) termWrite("→ " + why + "\n", "why");
        const hint = tc.game && r.status === "error" ? errHint(r.name, last) : "";
        if (hint) termWrite("→ " + hint + "\n", "why");
        mascotReact("fail"); return;
      }
    }
  }
  termWrite(t("pass", S.current === LEVELS.length - 1) + "\n", "pass");
  /* the code that passed: the next part of the game starts from it */
  S.won[S.lang + ":" + level().id] = src;
  completeLevel();
}
/* Shows the learner exactly where their output differs from the required one */
function explainFail(L, got, src, ctx) {
  /* A level can explain in words what is still missing */
  const why = L.why ? L.why(got, src, ctx) : null;
  if (why) { termWrite(t("notYet") + "\n", "fail"); termWrite("→ " + why + "\n", "why"); return; }
  const exp = L.expect ? L.expect(ctx) : null;
  if (exp == null) { termWrite(t("notYet") + "\n", "fail"); return; }
  if (got === exp) { termWrite(t("notYet") + "\n", "fail"); termWrite("→ " + t("outputOkCode") + "\n", "why"); return; }
  const d = describeMismatch(exp, got, src);
  termWrite(t("mismatch") + "\n", "fail");
  if (d.kind === "nothing") {
    termWrite("→ " + t("nothing") + "\n", "why");
  } else {
    const la = t("expLabel") + ": ", lb = t("gotLabel") + ": ";
    const w = Math.max(la.length, lb.length);
    if (d.kind === "diff") {
      if (d.multi) termWrite(t("lineOf", d.line) + "\n", "dim");
      termWrite(la.padEnd(w)); termWrite(d.a + "\n", "pass");
      termWrite(lb.padEnd(w)); termWrite(d.b + "\n", "typed");
      termWrite(" ".repeat(w + d.col) + "^\n", "err");
      if (d.special) termWrite("→ " + t("specialHint", d.special) + "\n", "why");
    } else {
      termWrite("→ " + t(d.kind) + "\n", "why");
      if (d.kind === "fewerLines") { termWrite(la.padEnd(w)); termWrite(d.a + "\n", "pass"); }
      else { termWrite(lb.padEnd(w)); termWrite(d.b + "\n", "typed"); }
    }
  }
  for (const h of d.hints) termWrite("→ " + t(h) + "\n", "why");
}

  const i = seed == null ? Math.floor(Math.random() * arr.length) : Math.abs(seed) % arr.length;
  return arr[i];
}
function hashStr(s) { let h = 0; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) | 0; return h; }
/* kind: run | pass | fail | error | qpass | qfail (a quiz answer) | null (back to idle) */
function mascotReact(kind) {
  if (S.view !== "lessons" || S.mode !== "lessons") return;
  const key = worldMascot(level());
  ui.mexpr = { run: "t", pass: "h", fail: "o", error: "o", qpass: "h", qfail: "o" }[kind] || "i";
  if (kind) ui.msay = pickLine(key, kind);
  drawLevelMascot();
}
function drawLevelMascot() {
  const cv = $("lv-mascot"), say = $("lv-say");
  if (!cv) return;
  const key = worldMascot(level());
  paintMascot(cv, key, ui.mexpr, false);
  cv.className = "px " + (ui.mexpr === "i" && MASCOTS[key].blinkBody ? "a-curs" : ANIM[ui.mexpr]);
  if (say) say.textContent = ui.msay;
}
setInterval(() => {
  if (document.hidden || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = $("lv-mascot");
  if (cv && ui.mexpr === "i") {
    const key = worldMascot(level());
    paintMascot(cv, key, "i", true);
    setTimeout(() => { if (ui.mexpr === "i" && $("lv-mascot") === cv) paintMascot(cv, key, "i", false); }, 140);
  }
}, 3600);

/* ---------- Sounds: soft, short, and only after a click ---------- */
let actx = null;
/* Sounds need a tap to start on phones. Every tap keeps the audio awake (iPhones pause it when the app goes to the background). */
function sfxUnlock() {
  if (!S.sound) return null;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state !== "running") actx.resume().catch(() => {});
    if (!actx.__primed) {
      const b = actx.createBuffer(1, 1, 22050), src = actx.createBufferSource();
      src.buffer = b; src.connect(actx.destination); src.start(0);
      actx.__primed = true;
    }
    return actx;
  } catch (e) { return null; }
}
/* On iPhone the silent switch mutes web sounds unless the page asks for "playback" audio */
function audioSessionFor(play) {
  try { if ("audioSession" in navigator) navigator.audioSession.type = play ? "playback" : "auto"; } catch (e) {}
}
["pointerdown", "touchend", "keydown"].forEach((ev) => document.addEventListener(ev, () => { if (S.sound) sfxUnlock(); }, { passive: true, capture: true }));
function tone(f, at, dur, vol = 0.05, type = "sine") {
  if (!S.sound || !actx) return;
  try {
    audioSessionFor(true);
    if (actx.state !== "running") actx.resume().catch(() => {});
    const o = actx.createOscillator(), g = actx.createGain(), s = actx.currentTime + at;
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, s);
    g.gain.exponentialRampToValueAtTime(vol, s + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, s + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(s); o.stop(s + dur + 0.05);
  } catch (e) {}
}
const SFX = {
  pass: () => { tone(523.25, 0, 0.35, 0.09); tone(659.25, 0.12, 0.5, 0.09); },
  star: (i) => tone(880 + i * 110, 0, 0.18, 0.05, "triangle"),
  rank: () => { tone(523.25, 0, 0.3, 0.09); tone(659.25, 0.1, 0.3, 0.09); tone(783.99, 0.2, 0.6, 0.09); },
  right: () => tone(659.25, 0, 0.25, 0.07)
};
$("sound").onclick = () => { S.sound = !S.sound; save(); if (S.sound) { sfxUnlock(); SFX.right(); } else audioSessionFor(false); applyStatic(); };

/* ---------- Rank in the header ---------- */

  const pct = next ? ((S.bytes - RANKS[r].at) / (next.at - RANKS[r].at)) * 100 : 100;

/* ---------- Completing a level ---------- */
function completeLevel() {
  const lv = level(), id = lv.id, att = attempt(id);
  const got = starsFor(item().kind, att, (lesson().quiz || []).length), old = S.stars[id] || 0, best = Math.max(old, got);
  const gained = bytesFor(lv, best, old);
  const r0 = rankOf(S.bytes);
  S.stars[id] = best; S.bytes += gained;
  delete S.attempt[id];
  ui.hint = 0; ui.sol = false;
  const worldDone = !old && WORLDS[lv.w].levels[WORLDS[lv.w].levels.length - 1] === id;
  save();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  mascotReact("pass");
  renderPanel(); renderRank();
  celebrate({ lv, got, best, gained, rankUp: rankOf(S.bytes) > r0 ? rankOf(S.bytes) : -1, worldDone });
}

/* ---------- Level: explanation on the left, quest above the editor ---------- */

/* ---------- Quest: the task above the editor. Quizzes and "order" levels are played right here ---------- */
const questTag = (it) => (it.boss ? "tagBoss" : it.review ? "tagReview" : it.build ? "tagBuild" : it.kind === "quiz" ? "tagPredict" : it.kind === "order" ? "tagOrder" : "questTag");

  else {

}

/* Help in steps: a question that points the way, then the plan in words, then (only then) the solution */
function helpHtml(lv, L, st, lead = "") {
  const hs = L.hints || [], n = hs.length, shown = Math.min(ui.hint, n), att = attempt(lv.id);
  const boxes = hs.slice(0, shown).map((h, i) => `<div class="hintbox"><div><b>${t(lv.boss ? "bossHintN" : "hintN", i + 1, n)}.</b> ${escHtml(h)}</div></div>`).join("");
  const solOpen = shown >= n || st > 0 || !!att.sol;
  const solBox = ui.sol && solOpen ? `<div class="hintbox"><b>${t("solTitle")}</b><pre>${highlight(L.solution)}</pre><div class="row"><button class="btn tiny" id="usesol">${t(item().kind === "order" ? "useSolOrder" : "useSol")}</button></div></div>` : "";
  const label = shown >= n ? t("hideHints") : shown === 0 ? t(lv.boss ? "bossHint" : "hint") : t(lv.boss ? "bossHintMore" : "hintMore");
  return `${boxes}${solBox}
    <div class="row q-actions">
      ${lead}${n ? `<button class="btn" id="hint">${label}</button>` : ""}
      ${solOpen ? `<button class="btn" id="sol">${ui.sol ? t("hideSol") : t("sol")}</button>` : ""}

}
function bindHelp(lv, L) {
  const att = attempt(lv.id), n = (L.hints || []).length;
  const hb = $("hint");
  if (hb) hb.onclick = () => {
    if (ui.hint >= n) { ui.hint = 0; ui.sol = false; }
    else { ui.hint++; if (!att.hint) { att.hint = true; save(); } }
    renderQuest();

  };

  if (sb) sb.onclick = () => {

    if (ui.sol && !att.sol) { att.sol = true; save(); }

    const again = $("sol"); if (again) again.focus({ preventScroll: true });
  };
  const use = $("usesol");
  if (use) use.onclick = () => {
    if (item().kind === "order") { ui.order = orderSolved(L); orderSave(L); renderQuest(); return; }
    code.focus(); code.select(); insertAt(code, L.solution + "\n"); persistEditor();

}

/* Quizzes: one question at a time. "spot" questions ask to tap a line of the code */
function quizState(L) {
  if (!ui.quiz) ui.quiz = { i: Math.min(attempt(level().id).q || 0, L.quiz.length - 1), wrong: [], solved: false };
  return ui.quiz;
}
function quizHtml(L) {
  const qs = quizState(L), n = L.quiz.length, q = L.quiz[qs.i];
  const steps = n > 1 ? `<div class="qsteps"><span class="qdots" aria-hidden="true">${L.quiz.map((_, k) => `<i class="${k < qs.i || (k === qs.i && qs.solved) ? "done" : k === qs.i ? "cur" : ""}"></i>`).join("")}</span><span>${t("quizStep", qs.i + 1, n)}</span></div>` : "";
  let ask;
  if (q.spot) {
    ask = `<div class="spot">${q.code.split("\n").map((ln, k) => {
      /* an empty line is only spacing: there's nothing on it to fix, so it can't be tapped */
      if (!ln.trim()) return `<div class="spot-ln blank" aria-hidden="true"><span class="ln-n">${k + 1}</span><code> </code></div>`;
      const cls = qs.solved && k === q.correct ? "right" : qs.wrong.includes(k) ? "wrong" : "";
      return `<button class="spot-ln ${cls}" data-q="${k}" ${qs.solved || qs.wrong.includes(k) ? "disabled" : ""} aria-label="${escHtml(t("ordLine", k + 1, ln.trim()))}"><span class="ln-n" aria-hidden="true">${k + 1}</span><code>${highlight(ln)}</code></button>`;
    }).join("")}</div>`;
  } else {
    const wide = q.options.some((o) => o.length > 22 || o.split("\n").length > 3);
    ask = (q.code ? `<div class="ex"><pre>${highlight(q.code)}</pre></div>` : "") + `<div class="qopts ${wide ? "wide" : ""}">${q.options.map((o, i) => {
      const cls = qs.solved && i === q.correct ? "right" : qs.wrong.includes(i) ? "wrong" : "";
      return `<button class="qopt ${cls}" data-q="${i}" ${qs.solved || qs.wrong.includes(i) ? "disabled" : ""}><pre>${escHtml(o)}</pre></button>`;
    }).join("")}</div>`;
  }
  const fb = qs.solved ? `<p class="qfb good"><b>${t("quizRight")}</b> ${escHtml(q.explain || "")}</p>`
    : qs.wrong.length ? `<p class="qfb bad">${t(q.spot ? "spotWrong" : "quizWrong")}</p>` : "";
  const acts = qs.solved ? `<div class="row"><button class="btn primary" id="q-next">${qs.i + 1 < n ? t("quizNext") : t("quizEnd")}</button>${q.code ? `<button class="btn" id="q-run" data-run>${t("quizRun")}</button>` : ""}</div>` : "";
  const from = q.folder != null && WORLDS[q.folder] ? `<span class="q-folder">${escHtml(t("quizFolder", dirName(WORLDS[q.folder], S.lang)))}</span>` : "";
  return `${steps}<p class="q-ask">${from}${escHtml(q.q || t(q.spot ? "spotQ" : "quizQ"))}</p>${ask}<div class="qfb-wrap" aria-live="polite">${fb}</div>${acts}<p class="rule">${t("quizStar", n)}</p>`;
}
function bindQuiz(L) {
  const qs = ui.quiz, q = L.quiz[qs.i];
  questEl.querySelectorAll("[data-q]").forEach((b) => { b.onclick = () => answerQuiz(+b.dataset.q); });
  const qr = $("q-run"); if (qr) qr.onclick = () => runFile(q.code, curFile());
  const nx = $("q-next"); if (nx) nx.onclick = nextQuestion;
}
function answerQuiz(i) {
  const L = lesson(), qs = ui.quiz, att = attempt(level().id);
  if (!qs) return;
  const q = L.quiz[qs.i];
  sfxUnlock();
  if (qs.solved || qs.wrong.includes(i)) return;
  if (i === q.correct) { qs.solved = true; SFX.right(); mascotReact("qpass"); }
  else { qs.wrong.push(i); att.wrong = (att.wrong || 0) + 1; save(); mascotReact("qfail"); }
  renderQuest();
  const f = $("q-next") || questEl.querySelector("[data-q]:not(:disabled)");
  if (f) f.focus({ preventScroll: true });
}
function nextQuestion() {
  const L = lesson(), qs = ui.quiz, att = attempt(level().id);
  if (!qs || !qs.solved) return;
  if (qs.i + 1 >= L.quiz.length) { completeLevel(); return; }
  ui.quiz = { i: qs.i + 1, wrong: [], solved: false };
  att.q = ui.quiz.i; save();
  mascotReact(null);
  renderQuest();
  const f = questEl.querySelector("[data-q]"); if (f) f.focus({ preventScroll: true });
  if (questEl.getBoundingClientRect().top < 0) questEl.scrollIntoView({ block: "start", behavior: "smooth" });
}

/* "Order" levels: the lines are given, shuffled and without indentation. The learner builds the program
   by tapping them, then sets each line's indentation. The program is saved like an editor draft. */
const levelOfIndent = (ln) => Math.floor((ln.length - ln.trimStart().length) / 4);
function orderShuffle(lines, seed) {
  const r = seeded(seed >>> 0), a = lines.map((_, i) => i);
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  if (a.length > 1 && a.every((k, i) => lines[k].trim() === lines[i].trim())) [a[0], a[1]] = [a[1], a[0]];
  return a;
}
function orderInit(L) {
  const id = level().id, shuf = orderShuffle(L.lines, hashStr(id + S.lang));
  const o = { shuf, prog: [], sel: -1, err: 0 };
  const saved = S.code[S.lang + ":" + id];
  if (typeof saved === "string") {
    const free = shuf.slice();
    for (const raw of saved.split("\n")) {
      const txt = raw.trim(); if (!txt) continue;
      const at = free.findIndex((k) => L.lines[k].trim() === txt);
      if (at < 0) continue;
      o.prog.push({ k: free[at], ind: Math.min(4, levelOfIndent(raw)) });
      free.splice(at, 1);
    }
  }
  return o;
}
const orderPool = (o) => { const used = new Set(o.prog.map((p) => p.k)); return o.shuf.filter((k) => !used.has(k)); };
const orderCode = (L, o) => o.prog.map((p) => "    ".repeat(p.ind) + L.lines[p.k].trim()).join("\n");
const orderSolved = (L) => ({ shuf: orderShuffle(L.lines, hashStr(level().id + S.lang)), prog: L.lines.map((ln, k) => ({ k, ind: levelOfIndent(ln) })), sel: -1, err: 0 });
function orderSave(L) {
  const key = S.lang + ":" + level().id, v = orderCode(L, ui.order);
  if (S.code[key] !== v) { S.code[key] = v; S.codeAt[key] = Date.now(); save(); }
}
function orderHtml(L, st) {
  const o = ui.order || (ui.order = orderInit(L)), pool = orderPool(o);
  if (o.sel >= o.prog.length) o.sel = -1;
  const prog = o.prog.length ? o.prog.map((p, i) => {
    const txt = L.lines[p.k].trim();
    return `<li><button class="ord-ln ${i === o.sel ? "sel" : ""} ${o.err === i + 1 ? "bad" : ""}" data-p="${i}" style="--ind:${p.ind}" aria-pressed="${i === o.sel}" aria-label="${escHtml(t("ordLineInd", i + 1, p.ind, txt))}"><span class="ln-n" aria-hidden="true">${i + 1}</span><span class="ind" aria-hidden="true"></span><code>${highlight(txt)}</code></button></li>`;
  }).join("") : `<li class="ord-empty">${t("orderEmpty")}</li>`;
  const p = o.sel >= 0 ? o.prog[o.sel] : null;
  const tool = (op, label, sym, ok) => `<button class="btn tiny" data-op="${op}" aria-label="${escHtml(label)}" title="${escHtml(label)}" ${ok ? "" : "disabled"}>${sym}</button>`;
  const tools = p ? `<div class="ord-tools" role="toolbar" aria-label="${escHtml(t("orderTip"))}">
      ${tool("out", t("ordOut"), "⇤", p.ind > 0)}${tool("in", t("ordIn"), "⇥", p.ind < 4)}${tool("up", t("ordUp"), "↑", o.sel > 0)}${tool("down", t("ordDown"), "↓", o.sel < o.prog.length - 1)}
      <button class="btn tiny" data-op="del">${t("ordDel")}</button></div>`
    : o.prog.length ? `<p class="rule">${t("orderTip")}</p>` : "";
  const poolHtml = pool.length ? pool.map((k) => `<button class="ord-ln" data-k="${k}"><code>${highlight(L.lines[k].trim())}</code></button>`).join("") : `<p class="rule">${t("orderPoolDone")}</p>`;
  return `<div class="status ${st ? "ok" : ""}">${st ? t("statusDone") : t("statusOrder")}</div>
    <div class="ord">
      <div class="eyebrow">${t("orderProg")}</div>
      <ol class="ord-prog">${prog}</ol>
      ${tools}
      <div class="eyebrow">${t("orderPool")}</div>
      <div class="ord-pool">${poolHtml}</div>
    </div>`;
}
function bindOrder(L) {
  const o = ui.order;
  questEl.querySelectorAll(".ord-pool [data-k]").forEach((b) => {
    b.onclick = () => {
      o.prog.push({ k: +b.dataset.k, ind: 0 });
      o.sel = o.prog.length - 1; o.err = 0;
      orderSave(L); renderQuest();
      const nb = questEl.querySelector(".ord-pool [data-k]") || $("ord-run");
      if (nb) nb.focus({ preventScroll: true });
      orderReveal();
    };
  });
  questEl.querySelectorAll(".ord-prog [data-p]").forEach((b) => {
    const i = +b.dataset.p;
    b.onclick = () => {
      o.sel = o.sel === i ? -1 : i;
      renderQuest();
      const a = questEl.querySelector(`.ord-prog [data-p="${i}"]`); if (a) a.focus({ preventScroll: true });
    };
    /* keyboard: arrows change the indentation, Alt+arrows move the line, Delete removes it */
    b.onkeydown = (e) => {
      let op = { ArrowLeft: "out", ArrowRight: "in", Delete: "del", Backspace: "del" }[e.key];
      if (e.altKey && e.key === "ArrowUp") op = "up";
      if (e.altKey && e.key === "ArrowDown") op = "down";
      if (!op) return;
      e.preventDefault(); o.sel = i; orderOp(L, op, true);
    };
  });
  questEl.querySelectorAll("[data-op]").forEach((b) => { b.onclick = () => orderOp(L, b.dataset.op, false); });
  $("ord-run").onclick = () => orderRun(L);
}
/* On wide screens the quest box scrolls: keep the selected line and its tools in sight */
function orderReveal() {
  if (questEl.scrollHeight <= questEl.clientHeight + 1) return;
  const el = questEl.querySelector(".ord-tools") || questEl.querySelector(".ord-ln.sel");
  if (!el) return;
  const q = questEl.getBoundingClientRect(), r = el.getBoundingClientRect();
  if (r.bottom > q.bottom) questEl.scrollTop += r.bottom - q.bottom + 8;
  else if (r.top < q.top) questEl.scrollTop -= q.top - r.top + 8;
}
function orderOp(L, op, fromKey) {
  const o = ui.order, i = o.sel, p = o.prog[i];
  if (!p) return;
  if (op === "in" && p.ind < 4) p.ind++;
  else if (op === "out" && p.ind > 0) p.ind--;
  else if (op === "up" && i > 0) { [o.prog[i - 1], o.prog[i]] = [o.prog[i], o.prog[i - 1]]; o.sel = i - 1; }
  else if (op === "down" && i < o.prog.length - 1) { [o.prog[i + 1], o.prog[i]] = [o.prog[i], o.prog[i + 1]]; o.sel = i + 1; }
  else if (op === "del") { o.prog.splice(i, 1); o.sel = -1; }
  else return;
  o.err = 0;
  orderSave(L); renderQuest();
  const f = (!fromKey && questEl.querySelector(`[data-op="${op}"]:not(:disabled)`)) || questEl.querySelector(`.ord-prog [data-p="${Math.max(0, Math.min(o.sel < 0 ? i : o.sel, o.prog.length - 1))}"]`);
  if (f) f.focus({ preventScroll: true });
  orderReveal();
}
async function orderRun(L) {
  const o = ui.order, left = orderPool(o).length;
  sfxUnlock();
  if (coarse) termCard.scrollIntoView({ block: "nearest", behavior: "smooth" });
  if (left) { newline(); termWrite(t("orderLeft", left) + "\n", "why"); return; }
  const status = await runFile(orderCode(L, o), curFile(), { lessonCheck: true });
  /* an error points at its line in the program */
  if (status === "error" && lastErr && ui.order === o && S.view === "lessons" && lastErr <= o.prog.length) { o.err = lastErr; o.sel = lastErr - 1; renderQuest(); }
}

/* ---------- Online sync: the base for a free server ----------
   To connect a server, fill REMOTE with pull(user) -> saved progress or null, and push(user, progress).

const REMOTE = { enabled: false, pull: null, push: null };

  if (!REMOTE.enabled || !ACC.current) return;

    if (remote) { applyProgress(mergeStates(S, remote)); save(true); renderRank(); if (!running) renderPanel(); }

    else if (a.key === "bugUp") { const img = sprite("bug", "o", Math.floor(T * 10) % 2); c.save(); c.translate(Math.round(a.x) - 19, G + 20); c.scale(1, -1); c.drawImage(img, 0, 0); c.restore(); }

}
function introCues(T) {
  const cmd = "python3 arcode.py", n = Math.max(0, Math.min(cmd.length, Math.floor((T - 0.05) / 0.03)));
  const l2 = !IN.story ? "introReady" : T >= TL.fix ? "introFixed" : T >= 0.8 ? "introBug" : "";
  const key = n + l2 + S.lang;
  if (key !== IN.outKey) {
    IN.outKey = key;
    introOut.innerHTML = `<span class="pr">$</span> ${escHtml(cmd.slice(0, n))}${n < cmd.length ? '<span class="cur2"></span>' : ""}${l2 ? `\n<span class="${l2 === "introBug" ? "warn" : "ok"}">${escHtml(t(l2))}</span>` : ""}`;
  }
  if (T >= TL.logo && !IN.logo) { IN.logo = true; introEl.classList.add("show-logo"); }
  if (T >= TL.card && !IN.card) { IN.card = true; showIntroCard(); }
}
function introFrame(now) {

  const T = (now - IN.t0) / 1000;

  IN.last = now;

}
function markIntroLang() { introEl.querySelectorAll("[data-il]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.il === S.lang)); }
function showIntroCard() {
  IN.phase = "idle";
  introSkip.hidden = true;
  if (ACC.current) {
    /* Already logged in: a quick hello and into the app */
    introHello.textContent = t("welcomeBack", ACC.current); introHello.hidden = false;
    setTimeout(closeIntro, IN.reduce ? 900 : 1500);
    return;
  }

/* Shown every time the app opens. Logged in: the scene, then straight in. Not logged in: the scene, then the access card. */
function startIntro() {
  const motion = !(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);

  if (!story && ACC.current) return;
  Object.assign(IN, { open: true, acct: !ACC.current, reduce: !motion, story, phase: story ? "anim" : "idle", outKey: "", logo: false, card: false, poke: null, cheer: null });
  introEl.hidden = false; introEl.classList.remove("leaving", "show-logo");

}
function skipIntro() {
  if (!IN.open) return;
  if (ACC.current && introCard.hidden) { closeIntro(); return; }
  if (IN.phase !== "anim") return;
  IN.t0 = performance.now() - TL.card * 1000 - 20;
  introCues(introT());
}
function closeIntro() {
  if (!IN.open) return;
  IN.open = false; IN.on = false; cancelAnimationFrame(IN.raf);
  maybeAskProject();
  document.body.classList.remove("intro-open"); wrapEl.inert = false;
  introEl.classList.add("leaving");
  setTimeout(() => {
    if (IN.open) return;
    introEl.hidden = true; introEl.classList.remove("leaving", "show-logo");

/* Logged in from the welcome card: everyone cheers, then into the app */
function introDone(u) {

  introHello.textContent = t("welcomeBack", u); introHello.hidden = false;
  IN.cheer = introT();
  if (S.sound) { sfxUnlock(); SFX.pass(); }

/* Tap a mascot on the welcome screen and it hops */
function pokeMascot(e) {
  const r = introCv.getBoundingClientRect(), x = (e.clientX - r.left) / IN.s, y = (e.clientY - r.top) / IN.s, L = lineup(IN.W);
  let best = null, bd = 1e9;
  for (const k of CAST) { const p = L[k], d = Math.abs(p.x - x) + Math.abs(p.y - 15 - y) * 0.6; if (d < bd) { bd = d; best = k; } }

introSkip.onclick = (e) => { e.stopPropagation(); skipIntro(); };
introEl.addEventListener("click", (e) => {

  if (e.target.closest(".intro-stage") && IN.on) pokeMascot(e);
});
document.addEventListener("keydown", (e) => {
  if (!IN.open) return;
  if (IN.phase === "anim" && ["Enter", " ", "Escape"].includes(e.key)) { e.preventDefault(); skipIntro(); }

introEl.querySelectorAll("[data-il]").forEach((b) => {
  b.onclick = () => {
    const typed = $("a-user") ? $("a-user").value : "";
    setLang(b.dataset.il); markIntroLang(); IN.outKey = "";
    if (!introCard.hidden && ui.acct && ui.acct.intro) { ui.acct.user = typed; ui.acct.err = ""; renderAccount(); }
    if (!introHello.hidden && ACC.current) introHello.textContent = t("welcomeBack", ACC.current);

window.addEventListener("resize", () => { if (!IN.open) return; introLayout(); if (!IN.on) drawStage(introT()); });

/* ---------- Boot ---------- */
const APP_VERSION = "8471099e46", APP_BUILT = "2026-11-09T13:02Z";
const IS_APP = !!document.querySelector('link[rel="manifest"]');
/* "Update now" reloads the page by itself: that's not a new opening, so no opening scene, just a word on how it went */
const UPD_KEY = "arcode-updating-from";
let updFrom = null;
try { updFrom = sessionStorage.getItem(UPD_KEY); sessionStorage.removeItem(UPD_KEY); } catch (e) {}
applyTheme();
applyFont();
setView(S.view, true);
if (S.view === "map" || S.view === "worlds") loadEditor();
applyStatic();
measureWork();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(measureWork);
if (!updFrom) startIntro();
if (!IN.open) maybeAskProject();
termWrite(t("loadingFull") + "\n", "dim");
/* ---------- Updates ---------- */
/* The installable app asks its own site; the preview on Claude can only compare with the site and reload */
const SITE_URL = "https://blfrlrnz.github.io/Coding_gym/";
const upd = { st: "idle", j: null, at: 0 };
if (IS_APP && "serviceWorker" in navigator) {
  try { navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then((r) => r.update()).catch(() => {}); } catch (e) {}
}
const builtAt = (s) => { const d = new Date(s); return isNaN(d) ? 0 : +d; };
/* newer means built later; two different builds with no dates count as newer */
const isNewer = (j) => j.version !== APP_VERSION && (!builtAt(j.built) || !builtAt(APP_BUILT) || builtAt(j.built) > builtAt(APP_BUILT));
async function fetchLatest() {
  const r = await fetch((IS_APP ? "version.json" : SITE_URL + "version.json") + "?t=" + Date.now(), { cache: "no-store" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  const j = await r.json();
  if (!j || !j.version) throw new Error("no version");
  return j;
}
const settingsOpen = () => !setEl.hidden;
function checkUpdate() {
  if (!IS_APP || !navigator.onLine || upd.st === "working") return;
  if (upd.st === "new") { if (!document.querySelector(".update-bar") && !settingsOpen()) updateBar("new"); return; }
  fetchLatest().then((j) => { if (isNewer(j)) { Object.assign(upd, { st: "new", j, at: Date.now() }); if (settingsOpen()) renderSettings(); else updateBar("new"); } }).catch(() => {});
}
async function checkUpdateNow() {
  if (upd.st === "checking" || upd.st === "working") return;
  if (!navigator.onLine) { upd.st = "offline"; renderSettings(); return; }
  upd.st = "checking"; renderSettings();
  try {
    const j = await fetchLatest();
    Object.assign(upd, { st: isNewer(j) ? "new" : "latest", j, at: Date.now() });
    if (upd.st === "new" && IS_APP && !settingsOpen()) updateBar("new");

}
/* Update now: the new service worker first, then no old copy left in the offline cache, then a fresh page */
async function applyUpdate() {
  if (upd.st === "working") return;
  persistEditor(); save();
  if (!IS_APP) { location.reload(); return; }
  upd.st = "working";
  if (settingsOpen()) renderSettings(); else updateBar("working");
  try { sessionStorage.setItem(UPD_KEY, APP_VERSION); } catch (e) {}

    const reg = "serviceWorker" in navigator ? await navigator.serviceWorker.getRegistration() : null;

        const tm = setTimeout(res, 5000);
        w.addEventListener("statechange", () => { if (w.state === "activated" || w.state === "redundant") { clearTimeout(tm); res(); } });
      });
    }
  } catch (e) {}
  try { if (window.caches) { const keys = await caches.keys(); await Promise.all(keys.filter((k) => /^(arcode|palestra)-app/.test(k)).map((k) => caches.delete(k))); } } catch (e) {}

/* The strip at the bottom: a new version, the update running, how the update went */
function updateBar(kind) {

  clearTimeout(updateBar.timer);
  const msg = kind === "new" ? t("updateReady") : kind === "working" ? t("updWorking") : kind === "done" ? t("updDone", fmtDate(APP_BUILT)) : t("updStuck");
  const btn = kind === "new" ? `<button class="btn primary tiny" id="do-update">${t("updateNow")}</button>` : kind === "working" ? "" : `<button class="btn tiny" id="upd-ok">${t("close")}</button>`;

if (updFrom) setTimeout(() => updateBar(updFrom !== APP_VERSION ? "done" : "stuck"), 400);
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkUpdate(); });
window.addEventListener("online", checkUpdate);
setTimeout(checkUpdate, 4000);
setInterval(checkUpdate, 15 * 60 * 1000);
(async () => {

    ok = await loadSkulpt();

  applyStatic(); renderPanel();
