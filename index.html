<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#15203a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Palestra Python">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
html { color-scheme: light; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>Palestra Python</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:ital,wght@0,400;1,400&display=swap">
<style>
/* Layout: lesson notebook on the left, editor + always-dark terminal on the right; stacks on phones */
:root {
  --bg: #eef1f6;
  --paper: #fafbfd;
  --ink: #1b2433;
  --muted: #5b6578;
  --line: #d5dbe6;
  --accent: #2f5fb3;
  --accent-ink: #ffffff;
  --accent-soft: #dde6f6;
  --mustard: #b8860b;
  --ok: #24804e;
  --ok-soft: #dcefe3;
  --err: #c2413a;
  --err-soft: #f7e0de;
  --code-bg: #e7ecf4;
  --sel: rgba(47, 95, 179, 0.25);
  --syn-k: #8a3fa0;
  --syn-s: #2d7a3e;
  --syn-n: #b45f06;
  --syn-c: #7d879a;
  --syn-b: #1f6f8b;
  --syn-f: #2f5fb3;
  --term-bg: #15203a;
  --term-fg: #dbe3f1;
  --term-dim: #8592ad;
  --term-prompt: #f2c14e;
  --term-ok: #6fd39a;
  --term-err: #ff8a80;
  --term-line: #26324f;
  --term-tut: #8fd3ff;
  --plot-bg: #ffffff;
  --code-size: 14px;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1421; --paper: #151d2d; --ink: #e3e8f1; --muted: #98a3b8; --line: #2a3448;
    --accent: #7ea3ee; --accent-ink: #0e1421; --accent-soft: #1f2c47; --mustard: #f2c14e;
    --ok: #6fd39a; --ok-soft: #173327; --err: #ff8a80; --err-soft: #3a1f22;
    --code-bg: #1e2738; --sel: rgba(126, 163, 238, 0.32);
    --syn-k: #d59ae8; --syn-s: #8fd19e; --syn-n: #f2b56b; --syn-c: #7f8aa3; --syn-b: #6cc4d9; --syn-f: #7ea3ee;
    --term-bg: #0a101d; --term-line: #1d2740;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1421; --paper: #151d2d; --ink: #e3e8f1; --muted: #98a3b8; --line: #2a3448;
  --accent: #7ea3ee; --accent-ink: #0e1421; --accent-soft: #1f2c47; --mustard: #f2c14e;
  --ok: #6fd39a; --ok-soft: #173327; --err: #ff8a80; --err-soft: #3a1f22;
  --code-bg: #1e2738; --sel: rgba(126, 163, 238, 0.32);
  --syn-k: #d59ae8; --syn-s: #8fd19e; --syn-n: #f2b56b; --syn-c: #7f8aa3; --syn-b: #6cc4d9; --syn-f: #7ea3ee;
  --term-bg: #0a101d; --term-line: #1d2740;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 40px;
}
.wrap { max-width: 1320px; margin: 0 auto; display: grid; gap: 18px; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Header */
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand h1 { font-family: var(--f-display); font-weight: 800; font-size: 1.6rem; margin: 0; letter-spacing: -0.02em; }
.brand h1 span { color: var(--mustard); }
.brand small { color: var(--muted); font-family: var(--f-mono); font-size: 0.76rem; }
.hright { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.seg { display: flex; background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: transparent; color: var(--muted); padding: 5px 14px; border-radius: 999px; font-weight: 700; font-size: 0.92rem; }
.seg button[aria-selected="true"], .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg.small button { padding: 5px 10px; font-family: var(--f-mono); font-size: 0.8rem; }
.icon-btn { display: inline-grid; place-items: center; border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 999px; height: 34px; min-width: 34px; padding: 0 10px; font-weight: 700; font-size: 0.85rem; }
.icon-btn:hover { border-color: var(--accent); }

.grid { display: grid; grid-template-columns: minmax(0, 410px) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 900px) { .grid { grid-template-columns: minmax(0, 1fr); } }

/* Panel */
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 16px; min-width: 0; }
.pills { display: flex; flex-wrap: wrap; gap: 5px; }
.pill {
  width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line);
  background: transparent; color: var(--muted); font-family: var(--f-mono); font-size: 0.78rem;
  display: grid; place-items: center; padding: 0; font-variant-numeric: tabular-nums;
}
.pill.done { background: var(--ok-soft); color: var(--ok); border-color: transparent; font-weight: 700; }
.pill.current { border: 2px solid var(--accent); color: var(--ink); font-weight: 700; }
.progress { height: 6px; background: var(--code-bg); border-radius: 99px; overflow: hidden; margin-top: -6px; }
.progress i { display: block; height: 100%; background: var(--ok); border-radius: 99px; }
.eyebrow { font-family: var(--f-mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.panel h2 { font-family: var(--f-display); font-weight: 800; font-size: 1.5rem; line-height: 1.15; margin: 4px 0 0; text-wrap: balance; letter-spacing: -0.01em; }
.theory { display: grid; gap: 10px; }
.theory p { margin: 0; }
code { font-family: var(--f-mono); font-size: 0.86em; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
.ex { background: var(--code-bg); border-radius: 8px; overflow: hidden; }
.ex pre, .hintbox pre { margin: 0; font-family: var(--f-mono); font-size: 0.82rem; line-height: 1.6; padding: 10px 12px; overflow-x: auto; white-space: pre; font-variant-ligatures: none; }
.ex-foot { display: flex; justify-content: flex-end; padding: 0 8px 8px; }
.task { border-left: 3px solid var(--mustard); padding: 4px 0 4px 14px; display: grid; gap: 4px; }
.task .eyebrow { color: var(--mustard); }
.task p { margin: 0; }
.status { font-size: 0.9rem; color: var(--muted); }
.status.ok { color: var(--ok); font-weight: 700; }
.hintbox { background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; font-size: 0.93rem; display: grid; gap: 8px; }
.hintbox pre { background: var(--paper); border-radius: 6px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn {
  border: 1px solid var(--line); background: var(--paper); color: var(--ink);
  padding: 7px 14px; border-radius: 8px; font-weight: 700; font-size: 0.9rem;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.go { background: var(--ok); border-color: var(--ok); color: var(--paper); }
.btn.danger { background: var(--err); border-color: var(--err); color: var(--paper); }
.btn.tiny { padding: 4px 10px; font-size: 0.8rem; }
.btn:disabled { opacity: 0.45; cursor: default; }
.linkbtn { border: 0; background: none; color: var(--muted); text-decoration: underline; padding: 0; font-size: 0.85rem; }
.nav { justify-content: space-between; border-top: 1px solid var(--line); padding-top: 14px; }
.confirm { background: var(--err-soft); border-radius: 8px; padding: 12px; display: grid; gap: 10px; font-size: 0.92rem; }
.confirm p { margin: 0; }
.celebrate { background: var(--ok-soft); color: var(--ink); border-radius: 8px; padding: 12px; display: grid; gap: 10px; }
.celebrate p { margin: 0; }
.group { display: grid; gap: 8px; }
.plist { display: grid; gap: 4px; }
.prog { text-align: left; border: 1px solid transparent; background: transparent; color: var(--ink); font-family: var(--f-mono); font-size: 0.86rem; padding: 7px 10px; border-radius: 8px; }
.prog:hover { background: var(--code-bg); }
.prog.active { background: var(--accent-soft); border-color: var(--accent); font-weight: 600; }
.field { font-family: var(--f-mono); font-size: 0.86rem; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); min-width: 0; flex: 1 1 140px; }
.exlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.exlist li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.exlist li div { display: grid; min-width: 0; }
.exlist span { color: var(--muted); font-size: 0.85rem; }
table.cheat { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
table.cheat td { padding: 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
table.cheat td:first-child { font-family: var(--f-mono); font-size: 0.8rem; white-space: pre; padding-right: 12px; }
.cheat-wrap { overflow-x: auto; }

/* Syntax colors */
.t-k { color: var(--syn-k); }
.t-s { color: var(--syn-s); }
.t-n, .t-v { color: var(--syn-n); }
.t-c { color: var(--syn-c); font-style: italic; }
.t-b { color: var(--syn-b); }
.t-f { color: var(--syn-f); }

/* Workspace */
.work { display: grid; gap: 14px; min-width: 0; }
.editor-card { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; min-width: 0; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px 8px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.file { font-family: var(--f-mono); font-size: 0.82rem; color: var(--muted); display: flex; align-items: center; gap: 8px; min-width: 0; }
.file b { color: var(--ink); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mustard); flex: none; }
.kbd { font-family: var(--f-mono); font-size: 0.72rem; color: var(--muted); }
@media (pointer: coarse) { .kbd { display: none; } }
.editor { display: grid; grid-template-columns: auto minmax(0, 1fr); height: 340px; resize: vertical; overflow: hidden; min-height: 160px; }
@media (max-width: 900px) { .editor { height: 290px; } }
.gutter, .hl, textarea#code {
  font-family: var(--f-mono); font-size: var(--code-size); line-height: 1.6; tab-size: 4;
  font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; letter-spacing: 0;
}
.gutter {
  color: var(--muted); text-align: right; padding: 12px 10px 60px 14px; user-select: none; overflow: hidden;
  background: var(--code-bg); font-variant-numeric: tabular-nums; min-width: 46px; white-space: pre; margin: 0;
}
.gutter .eln { color: var(--paper); background: var(--err); border-radius: 3px; padding: 0 3px; }
.code-wrap { position: relative; overflow: hidden; min-width: 0; }
.hl, textarea#code { position: absolute; inset: 0; margin: 0; padding: 12px 14px; white-space: pre; border: 0; }
.hl { overflow: hidden; pointer-events: none; color: var(--ink); background: var(--paper); }
.hl > code { display: block; width: max-content; min-width: 100%; padding: 0 60px 60px 0; background: none; border-radius: 0; font-size: inherit; }
textarea#code {
  width: 100%; height: 100%; resize: none; outline: none; overflow: auto;
  background: transparent; color: transparent; -webkit-text-fill-color: transparent; caret-color: var(--ink);
  overflow-wrap: normal; word-break: normal;
}
textarea#code::selection { background: var(--sel); }
textarea#code:focus-visible { box-shadow: inset 0 0 0 2px var(--accent-soft); }
.symbar { display: flex; gap: 6px; overflow-x: auto; padding: 8px 10px; border-top: 1px solid var(--line); }
.symbar button {
  flex: none; min-width: 38px; height: 36px; border: 1px solid var(--line); border-radius: 7px;
  background: var(--code-bg); color: var(--ink); font-family: var(--f-mono); font-size: 0.95rem; padding: 0 8px;
}
@media (pointer: fine) { .symbar { display: none; } }

.term-card { background: var(--term-bg); border-radius: 14px; overflow: hidden; min-width: 0; border: 1px solid var(--term-line); }
.term-card .bar { border-color: var(--term-line); }
.term-card .file { color: var(--term-dim); }
.term-card .file b { color: var(--term-fg); }
.tbtn { border: 1px solid var(--term-line); background: transparent; color: var(--term-fg); padding: 5px 12px; border-radius: 7px; font-size: 0.84rem; font-weight: 700; }
.tbtn:hover { border-color: var(--term-dim); }
.tbtn.stop { color: var(--term-err); border-color: var(--term-err); }
#term {
  font-family: var(--f-mono); font-size: var(--code-size); line-height: 1.6; color: var(--term-fg);
  padding: 12px 14px 16px; height: 300px; overflow-y: auto; white-space: pre-wrap; word-break: break-word;
  font-variant-ligatures: none; cursor: text;
}
#term .cmd { color: var(--term-prompt); }
#term .dim { color: var(--term-dim); }
#term .err { color: var(--term-err); }
#term .why { color: var(--term-dim); font-style: italic; font-family: var(--f-body); }
#term .pass { color: var(--term-ok); font-weight: 600; }
#term .fail { color: var(--term-prompt); }
#term .typed { color: var(--term-prompt); }
#term .ps { color: var(--term-dim); }
#term form { margin: 0; }
#term .tin { display: inline; }
#term .prow { display: flex; }
#term .prow .ps { flex: none; white-space: pre; }
#term input {
  font: inherit; color: var(--term-prompt); background: transparent; border: 0; outline: none; padding: 0;
  caret-color: var(--term-prompt); min-width: 0;
}
#term .tin input { border-bottom: 1px dashed var(--term-dim); width: 50%; min-width: 8ch; }
#term .prow input { flex: 1; white-space: pre; }
#term .tut { color: var(--term-tut); font-family: var(--f-body); }
#term img.plot { display: block; max-width: min(100%, 640px); height: auto; background: var(--plot-bg); border-radius: 6px; margin: 6px 0; }
.note { font-size: 0.84rem; color: var(--muted); margin: 0; }

/* Terminal page: terminal takes the wide column, guide sits beside it */
.grid.termview { grid-template-columns: minmax(0, 1fr) minmax(0, 340px); }
.grid.termview .work { order: -1; }
.grid.termview #editor-card { display: none; }
.grid.termview #term { height: max(380px, calc(100vh - 230px)); height: max(380px, calc(100dvh - 230px)); }
@media (max-width: 900px) {
  .grid.termview { grid-template-columns: minmax(0, 1fr); }
  .grid.termview #term { height: max(340px, calc(100vh - 300px)); height: max(340px, calc(100dvh - 300px)); }
  .thint { display: none; }
}
.term-card .symbar { border-top: 1px solid var(--term-line); }
.term-card .symbar button { background: var(--term-line); color: var(--term-fg); border-color: var(--term-line); }
.tutcard { border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; }
.tutcard p { margin: 0; }
.tutcard .tutlabel { color: var(--accent); }
.tutnow { font-size: 0.95rem; }
.tutcard .progress { margin-top: 0; }
.notice { background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; font-size: 0.92rem; }
.notice a, .theory a { color: var(--accent); }
.pill.bonus:not(.done) { border-style: dashed; }
@media (prefers-reduced-motion: no-preference) {
  .btn, .pill, .seg button, .prog, .progress i { transition: background-color .15s, border-color .15s, color .15s, width .3s; }
}

/* Header rank */
.rank { display: flex; align-items: center; gap: 8px; background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-size: 0.82rem; }
.rname { font-weight: 700; }
.rbytes { font-family: var(--f-mono); font-size: 0.76rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.rbar { width: 54px; height: 6px; border-radius: 99px; background: var(--code-bg); overflow: hidden; }
.rbar i { display: block; height: 100%; background: var(--mustard); border-radius: 99px; }
#sound .mute { display: none; }
#sound.muted .mute { display: inline; }
#sound.muted .waves { display: none; }
.px { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }

/* Explorer: an editor-style file tree with a README preview */
.ide { background: var(--term-bg); color: var(--term-fg); border: 1px solid var(--term-line); border-radius: 14px; overflow: hidden; }
.ide-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 12px 10px 16px; border-bottom: 1px solid var(--term-line); }
.ide-title { font-family: var(--f-mono); font-size: 0.76rem; letter-spacing: 0.1em; color: var(--term-dim); }
.ide-title span { color: var(--term-fg); letter-spacing: 0; margin-left: 6px; }
.ide-stars { font-family: var(--f-mono); font-size: 0.8rem; color: var(--term-prompt); margin-left: auto; font-variant-numeric: tabular-nums; }
.ide-body { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); min-height: 540px; }
.tree { padding: 8px 0 16px; border-right: 1px solid var(--term-line); font-family: var(--f-mono); font-size: 0.88rem; }
.tr-row { width: 100%; display: flex; align-items: center; gap: 8px; border: 0; background: transparent; color: var(--term-fg); text-align: left; padding: 6px 14px; font: inherit; min-height: 36px; }
.tr-row:hover { background: rgba(255, 255, 255, 0.05); }
.tr-row:focus-visible { outline: 2px solid var(--term-prompt); outline-offset: -2px; }
.tr-folder .chev { color: var(--term-dim); flex: none; }
.tr-folder[aria-expanded="true"] .chev { transform: rotate(90deg); }
.tr-ic { display: flex; flex: none; }
.tr-folder .tr-ic { color: color-mix(in srgb, var(--wc) 72%, #ffffff); }
.tr-folder.sel { background: rgba(255, 255, 255, 0.07); }
.tr-folder.locked, .tr-folder.locked .tr-ic { color: var(--term-dim); }
.tr-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: none; max-width: 60%; }
.tr-title { color: var(--term-dim); font-family: var(--f-body); font-size: 0.84rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.tr-meta { margin-left: auto; color: var(--term-dim); font-size: 0.78rem; display: flex; align-items: center; gap: 4px; white-space: nowrap; flex: none; font-variant-numeric: tabular-nums; }
.tr-files { position: relative; }
.tr-files::before { content: ""; position: absolute; left: 21px; top: 0; bottom: 8px; width: 1px; background: var(--term-line); }
.tr-file { padding-left: 38px; }
.tr-file .tr-ic { color: color-mix(in srgb, var(--wc) 65%, #ffffff); }
.tr-file.lock { color: var(--term-dim); cursor: not-allowed; }
.tr-file.lock .tr-ic { color: var(--term-dim); }
.tr-file.lock .tr-title { opacity: 0.55; }
.tr-file.cur { background: color-mix(in srgb, var(--wc) 24%, transparent); }
.tr-file.boss:not(.lock) .tr-ic { color: #ff8a6b; }
.tr-st { color: var(--term-prompt); letter-spacing: 1px; }
.tr-st i { font-style: normal; color: var(--term-dim); opacity: 0.45; }
.tr-cur { color: var(--term-ok); }
.readme { background: var(--paper); color: var(--ink); display: flex; flex-direction: column; min-width: 0; }
.rm-tab { font-family: var(--f-mono); font-size: 0.78rem; color: var(--muted); padding: 9px 16px; border-bottom: 1px solid var(--line); background: var(--code-bg); }
.rm-body { padding: 20px; display: grid; gap: 12px; align-content: start; }
.rm-hero { display: flex; gap: 14px; align-items: center; }
.rm-m { width: 114px; height: 102px; border-radius: 12px; background: color-mix(in srgb, var(--wc) 14%, transparent); display: grid; place-items: center; flex: none; }
.rm-m .px { width: 114px; height: 102px; }
.readme.locked .rm-m .px { filter: grayscale(1); opacity: 0.6; }

<script type="text/x-python" id="py-runner">
import sys, ast, builtins, traceback, linecache, random, json, io, os, base64

os.environ.setdefault("MPLBACKEND", "AGG")
from js import ppEmit


class _NeedInput(BaseException):
    pass


_st = {"skip": 0, "pos": 0, "out": [], "inputs": [], "need": None, "silent": False, "images": 0}


def _emit(kind, s):
    n = 1 if kind == "img" else len(s)
    start = _st["pos"]
    _st["pos"] = start + n
    if kind == "out":
        _st["out"].append(s)
    elif kind == "img":
        _st["images"] += 1
    if _st["silent"] or _st["pos"] <= _st["skip"]:
        return
    if kind != "img" and start < _st["skip"]:
        s = s[_st["skip"] - start:]
    ppEmit(kind, s)


class _Stream(io.TextIOBase):
    def __init__(self, kind):
        super().__init__()
        self._kind = kind

    def writable(self):
        return True

    def write(self, s):
        s = str(s)
        if s:
            _emit(self._kind, s)
        return len(s)

    def flush(self):
        pass

    def isatty(self):
        return False

    @property
    def encoding(self):
        return "utf-8"


sys.stdout = _Stream("out")
sys.stderr = _Stream("err")


def _input(prompt=""):
    prompt = str(prompt)
    if prompt:
        _emit("prompt", prompt)
    if _st["inputs"]:
        v = _st["inputs"].pop(0)
        _emit("echo", v + "\n")
        return v
    _st["need"] = prompt
    raise _NeedInput()


builtins.input = _input


def _fresh_ns():
    return {"__name__": "__main__", "__builtins__": builtins}


_ns = _fresh_ns()


def _pp_show(*args, **kwargs):
    import matplotlib.pyplot as plt
    for num in plt.get_fignums():
        fig = plt.figure(num)
        buf = io.BytesIO()
        fig.savefig(buf, format="png", dpi=110, bbox_inches="tight")
        _emit("img", base64.b64encode(buf.getvalue()).decode("ascii"))
    plt.close("all")


def _pp_prep_mpl():
    try:
        import matplotlib
        matplotlib.use("agg")
        import matplotlib.pyplot as plt
        plt.show = _pp_show
    except Exception:
        pass


def _format_error(e, filename):
    name = type(e).__name__
    if isinstance(e, SyntaxError):
        text = "".join(traceback.format_exception_only(type(e), e))
        line = e.lineno if e.filename == filename else None
        return text, name, line
    tb = e.__traceback__
    while tb is not None and tb.tb_frame.f_code.co_filename != filename:
        tb = tb.tb_next
    if tb is None:
        tb = e.__traceback__
    text = "".join(traceback.format_exception(type(e), e, tb))
    line = None
    t = tb
    while t is not None:
        if t.tb_frame.f_code.co_filename == filename:
            line = t.tb_lineno
        t = t.tb_next
    return text, name, line


def _pp_reset():
    global _ns
    _ns = _fresh_ns()


def _pp_run(payload):
    global _ns
    p = json.loads(payload)
    src, filename, mode = p["src"], p["filename"], p["mode"]
    _st.update(skip=int(p.get("skip") or 0), pos=0, out=[], inputs=list(p.get("inputs") or []),
               need=None, silent=bool(p.get("silent")), images=0)
    linecache.cache[filename] = (len(src), None, src.splitlines(True), filename)
    if p.get("seed") is not None:
        random.seed(p["seed"])
    if mode == "repl":
        ns = _ns
    else:
        ns = _fresh_ns()
        plt = sys.modules.get("matplotlib.pyplot")
        if plt is not None:
            plt.close("all")
    status, err = "ok", None
    try:
        if mode == "repl":
            tree = ast.parse(src, filename, "exec")
            last = None
            if tree.body and isinstance(tree.body[-1], ast.Expr):
                last = ast.Expression(tree.body.pop().value)
            if tree.body:
                exec(compile(tree, filename, "exec"), ns)
            if last is not None:
                value = eval(compile(last, filename, "eval"), ns)
                if value is not None:
                    builtins._ = value
                    print(repr(value))
        else:
            exec(compile(src, filename, "exec"), ns)
    except _NeedInput:
        status = "need_input"
    except SystemExit:
        pass
    except BaseException as e:
        status = "error"
        err = _format_error(e, filename)
    if _st["need"] is not None:
        status = "need_input"
    if mode == "file" and status != "need_input":
        _ns = ns
    res = {"status": status, "out": "".join(_st["out"]), "pos": _st["pos"], "images": _st["images"]}
    if status == "need_input":
        res["prompt"] = _st["need"]
    if err:
        res["tb"], res["name"], res["line"] = err
    return json.dumps(res)
</script>
<script type="text/js-worker" id="py-worker">
/* Runs Pyodide off the main thread so the page stays responsive and Stop can terminate it. */
let py = null, runFn = null, resetFn = null, prepMpl = null;
self.ppEmit = (kind, text) => { self.postMessage({ t: "emit", kind: String(kind), text: String(text) }); };
const errText = (err) => String((err && (err.message || err)) || "Error");
self.onmessage = async (e) => {
  const m = e.data;
  try {
    if (m.t === "init") {
      importScripts(m.url + "pyodide.js");
      py = await loadPyodide({ indexURL: m.url });
      py.runPython(m.runner);
      runFn = py.globals.get("_pp_run");
      resetFn = py.globals.get("_pp_reset");
      prepMpl = py.globals.get("_pp_prep_mpl");
      const ver = py.runPython("import sys\nsys.version.split()[0]");
      self.postMessage({ t: "ready", version: String(ver) });
    } else if (m.t === "run") {
      const say = (s) => { if (!m.silent) self.postMessage({ t: "pkg", text: String(s) }); };
      try { await py.loadPackagesFromImports(m.src, { messageCallback: say, errorCallback: say }); }
      catch (err) { say(errText(err)); }
      if (/matplotlib/.test(m.src)) prepMpl();
      const out = runFn(JSON.stringify(m));
      self.postMessage({ t: "done", id: m.id, res: JSON.parse(String(out)) });
    } else if (m.t === "reset") {
      resetFn();
      self.postMessage({ t: "done", id: m.id, res: { status: "ok" } });
    } else if (m.t === "pip") {
      await py.loadPackage("micropip", { messageCallback: () => {} });
      await py.runPythonAsync("import micropip\nawait micropip.install(" + JSON.stringify(m.pkgs) + ")");
      self.postMessage({ t: "done", id: m.id, res: { status: "ok" } });
    }
  } catch (err) {
    if (m.t === "init") self.postMessage({ t: "fail", error: errText(err) });
    else self.postMessage({ t: "done", id: m.id, res: { status: "error", tb: errText(err) + "\n", name: "Error", line: null, out: "", pos: 0, images: 0 } });
  }
};
</script>

  id: "rules",
  it: {
    title: "Le regole di scrittura",
    theory: [
`<p>Python è precisissimo. Quattro regole da ricordare sempre:</p>
<ul>
<li><b>Maiuscole e minuscole contano</b>: <code>print</code> funziona, <code>Print</code> no.</li>
<li><b>Le parentesi vanno sempre in coppia</b>: ogni <code>(</code> ha la sua <code>)</code>.</li>
<li><b>Il testo va tra virgolette dritte</b>, <code>"ciao"</code> oppure <code>'ciao'</code>, aperte e chiuse con lo stesso tipo.</li>
<li><b>Gli spazi dentro le virgolette contano</b>, quelli fuori quasi mai: <code>print( "ciao" )</code> funziona come <code>print("ciao")</code>.</li>
</ul>`,
{ code: `print("Ciao")
print( "Ciao" )
print("C i a o")` }],
    task: `Questo programma ha due errori. Correggili in modo che stampi le due frasi. Premi Esegui per vedere cosa ti dice Python.`,
    starter: `Print("Python è preciso")\nprint("e anche tu lo sarai"\n`,
    solution: `print("Python è preciso")
print("e anche tu lo sarai")`,
    hint: `Guarda la prima lettera della prima riga, e conta le parentesi della seconda.`,
    check: (o) => o === "Python è preciso\ne anche tu lo sarai"
  },
  en: {
    title: "The writing rules",
    theory: [
`<p>Python is extremely precise. Four rules to always remember:</p>
<ul>
<li><b>Uppercase and lowercase matter</b>: <code>print</code> works, <code>Print</code> doesn't.</li>
<li><b>Parentheses always come in pairs</b>: every <code>(</code> has its <code>)</code>.</li>
<li><b>Text goes between straight quotes</b>, <code>"hi"</code> or <code>'hi'</code>, opened and closed with the same kind.</li>
<li><b>Spaces inside quotes matter</b>, outside them almost never: <code>print( "hi" )</code> works like <code>print("hi")</code>.</li>
</ul>`,
{ code: `print("Hello")
print( "Hello" )
print("H e l l o")` }],

    check: (o) => o === "Python is precise\nand so will you be"
  }
},

/* Keyboards (iPhone, iPad, Mac) can turn " and ' into curly quotes and insert invisible spaces */
const TYPED_FIX = /[“”„‟‘’‚‛  -‍  ⁠　﻿]/;
const ODD_SPACE = /[  -   　]/;
const ZERO_WIDTH = /[​-‍⁠﻿]/;
const SMART_D = "“”„‟", SMART_S = "‘’‚‛";
function cleanTyped(s) {
  return String(s).replace(/[“”„‟]/g, '"').replace(/[‘’‚‛]/g, "'")
    .replace(/[  -   　]/g, " ").replace(/[​-‍⁠﻿]/g, "");
}
/* Fixes curly quotes and odd spaces in code, leaving the text inside normal strings and comments untouched */
function fixSmartQuotes(src) {
  let out = "", i = 0;
  const n = src.length;
  while (i < n) {
    const c = src[i];
    if (c === "#") { let e = src.indexOf("\n", i); if (e < 0) e = n; out += src.slice(i, e); i = e; continue; }
    let q = null, smart = false;
    if (c === '"' || c === "'") q = c;
    else if (SMART_D.includes(c)) { q = '"'; smart = true; }
    else if (SMART_S.includes(c)) { q = "'"; smart = true; }
    if (q) {

/* Saved progress travels as a file or as a text code */
const SAVE_TAG = "PP3:";
function encodeSave(obj) {
  const json = JSON.stringify({ app: "palestra-python", v: 3, date: new Date().toISOString(), state: obj });
  const bytes = new TextEncoder().encode(json);
  let bin = ""; bytes.forEach((b) => { bin += String.fromCharCode(b); });
  return SAVE_TAG + btoa(bin);
}
function decodeSave(text) {
  let s = String(text || "").trim();
  let json;
  if (s.startsWith(SAVE_TAG)) {
    const bin = atob(s.slice(SAVE_TAG.length).replace(/\s+/g, ""));
    json = new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0)));
  } else json = s;
  const o = JSON.parse(json);
  if (!o || o.app !== "palestra-python" || !o.state || typeof o.state !== "object") throw new Error("bad save");
  return o;
}

  const ls = v.lastIndexOf("\n", s - 1) + 1;

  if (src.split("\n").every((l) => !l.trim() || l.trim().startsWith("#"))) { showPrompt(); if (refocus) focusPrompt(); return; }
  begin();
  const res = await engineRun(src, "<stdin>", "repl");
  const status = report(res, "repl", false);
  if (tut.active && status !== "stopped") tutOnResult({ src, out: norm(res.out || ""), status: res.status, name: res.name || "" });
  end(refocus);
}
async function runPip(args) {
  begin();
  const pkgs = args.split(/\s+/).filter((x) => x && !x.startsWith("-"));
  if (engine !== "pyodide") termWrite(t("pipBasic") + "\n", "fail");
  else if (pkgs.length) {
    termWrite(t("pipInstalling", pkgs.join(", ")) + "\n", "dim");
    const res = await workerCall({ t: "pip", pkgs });
    newline();
    if (res.status === "ok") termWrite(t("pipDone", pkgs.join(", ")) + "\n", "pass");
    else if (res.status === "error") {

}
async function checkLesson(res, src) {

  const got = norm(res.out || "");
  if (!L.check(got, src, ctx)) { explainFail(L, got, src, ctx); mascotReact("fail"); return; }
  const tests = L.tests ? L.tests(src) : [];

/* Shows the learner exactly where their output differs from the required one */
function explainFail(L, got, src, ctx) {
  const exp = L.expect ? L.expect(ctx) : null;
  if (exp == null) { termWrite(t("notYet") + "\n", "fail"); return; }
  if (got === exp) { termWrite(t("notYet") + "\n", "fail"); termWrite("→ " + t("outputOkCode") + "\n", "why"); return; }
  const d = describeMismatch(exp, got, src);
  termWrite(t("mismatch") + "\n", "fail");
  if (d.kind === "nothing") {
    termWrite("→ " + t("nothing") + "\n", "why");
  } else {
    const la = t("expLabel") + ": ", lb = t("gotLabel") + ": ";
    const w = Math.max(la.length, lb.length);
    if (d.kind === "diff") {
      if (d.multi) termWrite(t("lineOf", d.line) + "\n", "dim");
      termWrite(la.padEnd(w)); termWrite(d.a + "\n", "pass");
      termWrite(lb.padEnd(w)); termWrite(d.b + "\n", "typed");
      termWrite(" ".repeat(w + d.col) + "^\n", "err");
      if (d.special) termWrite("→ " + t("specialHint", d.special) + "\n", "why");
    } else {
      termWrite("→ " + t(d.kind) + "\n", "why");
      if (d.kind === "fewerLines") { termWrite(la.padEnd(w)); termWrite(d.a + "\n", "pass"); }
      else { termWrite(lb.padEnd(w)); termWrite(d.b + "\n", "typed"); }
    }

  for (const h of d.hints) termWrite("→ " + t(h) + "\n", "why");
}

function paintMascot(cv, key, e, blink) {

  for (let i = 0; i < F.length; i++) if (F[i]) { c.fillStyle = F[i]; c.fillRect(i % PX_W, Math.floor(i / PX_W), 1, 1); }

}

/* ---------- Sounds: soft, short, and only after a click ---------- */
let actx = null;
function sfxUnlock() {
  if (!S.sound) return null;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    return actx;
  } catch (e) { return null; }
}
function tone(f, at, dur, vol = 0.05, type = "sine") {
  if (!S.sound || !actx) return;
  try {
    const o = actx.createOscillator(), g = actx.createGain(), s = actx.currentTime + at;
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, s);
    g.gain.exponentialRampToValueAtTime(vol, s + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, s + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(s); o.stop(s + dur + 0.05);
  } catch (e) {}
}
const SFX = {
  pass: () => { tone(523.25, 0, 0.35); tone(659.25, 0.12, 0.5); },

  if (!ui.open) ui.open = new Set();
  if (ui.autoW !== curW) { ui.open.add(curW); ui.sel = curW; ui.autoW = curW; }
  const total = LEVELS.length * 3, got = LEVELS.reduce((a, l) => a + (S.stars[l.id] || 0), 0);
  const tree = WORLDS.map((w, wi) => {
    const idx = levelsOf(wi), locked = !unlocked(idx[0]), open = ui.open.has(wi);
    const wStars = idx.reduce((a, i) => a + (S.stars[LEVELS[i].id] || 0), 0);
    const head = `<button class="tr-row tr-folder ${locked ? "locked" : ""} ${ui.sel === wi ? "sel" : ""}" data-w="${wi}" aria-expanded="${open}">
      ${svgChev}<span class="tr-ic">${svgFolder(open)}</span><span class="tr-name">${dirName(w, S.lang)}/</span>
      <span class="tr-meta">${locked ? svgLock(13) : `★ ${wStars}/${idx.length * 3}`}</span></button>`;
    const files = !open ? "" : `<div class="tr-files" role="group">${idx.map((i) => {
      const lv = LEVELS[i], st = S.stars[lv.id] || 0, L = LESSON_BY_ID[lv.id][S.lang], fn = fileName(lv.id, S.lang);
      const state = st ? "done" : i === cur ? "cur" : unlocked(i) ? "open" : "lock";
      const meta = state === "lock" ? svgLock(13)
        : st ? `<span class="tr-st">${"★".repeat(st)}<i>${"★".repeat(3 - st)}</i></span>`
        : state === "cur" ? `<span class="tr-cur">● ${t("inProgress")}</span>` : "";
      const label = `${fn} · ${L.title}${state === "lock" ? " · " + t("levelLocked") : ""}`;
      return `<button class="tr-row tr-file ${state} ${lv.boss ? "boss" : ""}" data-lv="${i}" ${state === "lock" ? 'aria-disabled="true"' : ""} aria-label="${escHtml(label)}" title="${escHtml(L.title)}">
        <span class="tr-ic">${lv.boss ? svgBug(15) : svgFile}</span><span class="tr-name">${fn}</span><span class="tr-title">${escHtml(L.title)}</span><span class="tr-meta">${meta}</span></button>`;
    }).join("")}</div>`;
    return `<div class="tr-node" style="--wc:${MASCOTS[w.mascot].color}">${head}${files}</div>`;
  }).join("");
  mapEl.innerHTML = `<div class="ide">
    <div class="ide-bar"><span class="ide-title">${t("explorer").toUpperCase()} <span>~/${t("treeRoot")}</span></span>
      <span class="ide-stars">${t("mapStars", got, total)}</span><button class="btn primary" id="map-go">${t("continueBtn")}</button></div>
    <div class="ide-body"><nav class="tree" aria-label="${escHtml(t("explorer"))}">${tree}</nav><article class="readme" id="readme"></article></div></div>`;
  renderReadme();
  mapEl.querySelectorAll(".tr-folder").forEach((b) => {
    b.onclick = () => {
      const wi = +b.dataset.w;
      if (ui.open.has(wi) && ui.sel === wi) ui.open.delete(wi); else ui.open.add(wi);
      ui.sel = wi;
      renderMap();
      const again = mapEl.querySelector(`.tr-folder[data-w="${wi}"]`); if (again) again.focus();
    };
  });
  mapEl.querySelectorAll(".tr-file").forEach((b) => { b.onclick = () => { const i = +b.dataset.lv; if (unlocked(i)) goLesson(i); }; });
  $("map-go").onclick = () => goLesson(cur);
}
function renderReadme() {
  const wi = ui.sel, w = WORLDS[wi], idx = levelsOf(wi), cur = maxUnlocked();
  const locked = !unlocked(idx[0]), done = idx.filter((i) => S.stars[LEVELS[i].id]).length;
  const wStars = idx.reduce((a, i) => a + (S.stars[LEVELS[i].id] || 0), 0);
  const nextIdx = idx.find((i) => !S.stars[LEVELS[i].id] && unlocked(i));
  const prev = wi > 0 ? dirName(WORLDS[wi - 1], S.lang) : "";
  const el = $("readme");
  el.style.setProperty("--wc", MASCOTS[w.mascot].color);
  el.innerHTML = `<div class="rm-tab">README.md</div>
    <div class="rm-body">
      <div class="rm-hero"><div class="rm-m"></div><div class="rm-hd"><div class="rm-dir">~/${dirName(w, S.lang)}/</div><h2><span class="md">#</span> ${w[S.lang].name}</h2><p class="rm-tag">${locked ? t("folderLocked", prev) : w[S.lang].tag}</p></div></div>
      <blockquote class="rm-quote"><span class="md">&gt;</span> <b>${MASCOTS[w.mascot].name}:</b> ${escHtml(pickLine(w.mascot, "hello", hashStr(w.id + S.lang)))}</blockquote>
      <h3><span class="md">##</span> ${t("filesDone", done, idx.length)}</h3>
      <div class="rm-bar" aria-hidden="true"><i style="width:${(done / idx.length) * 100}%"></i></div>
      <p class="rm-stars">★ ${wStars}/${idx.length * 3}</p>
      ${nextIdx !== undefined ? `<button class="btn primary" id="rm-open">${t("openFile", fileName(LEVELS[nextIdx].id, S.lang))}</button>`
        : done === idx.length ? `<p class="rm-note">${t("replayFolder")}</p>` : ""}
    </div>`;
  const e = locked ? "i" : done === idx.length ? "h" : "i";
  el.querySelector(".rm-m").appendChild(mascotCanvas(w.mascot, e, locked ? "" : e === "h" ? "a-hop" : w.mascot === "cursy" ? "a-curs" : "a-bob"));
  el.classList.toggle("locked", locked);
  const ob = $("rm-open"); if (ob) ob.onclick = () => goLesson(nextIdx);
}

/* ---------- Level: explanation on the left, quest above the editor ---------- */
const questEl = $("quest");
function renderLevel() {
  const lv = level(), it = item(), L = it[S.lang], w = WORLDS[lv.w], key = worldMascot(lv);
  const st = S.stars[lv.id] || 0;
  if (!ui.msay) { ui.msay = pickLine(key, "hello", hashStr(lv.id + S.lang)); ui.mexpr = "i"; }
  const theory = L.theory.map((b, k) => typeof b === "string" ? b :
    `<div class="ex"><pre>${highlight(b.code)}</pre><div class="ex-foot"><button class="btn tiny" data-ex="${k}">${t("tryIt")}</button></div></div>`).join("");
  const needs = it.needs === "full" && engine === "skulpt" ? `<div class="notice">${t("needsFull")}</div>` : "";
  const prevOk = S.current > 0, nextOk = S.current + 1 < LEVELS.length && unlocked(S.current + 1);
  panel.innerHTML = `
    <div class="lv-top"><button class="linkbtn" id="to-map">${t("backExplorer")}</button><span class="crumb">~/${dirName(w, S.lang)}/<b>${curFile()}</b></span></div>
    <div class="lv-mascot" style="--wc:${MASCOTS[key].color}"><canvas id="lv-mascot" class="px" width="${PX_W}" height="${PX_H}" role="img" aria-label="${MASCOTS[key].name}"></canvas>
      <div class="bubble"><span class="who">${t("mascotSays", MASCOTS[key].name)}</span><p id="lv-say" aria-live="polite"></p></div></div>
    <div><h2>${lv.boss ? t("bossLabel", L.title) : L.title}</h2>
      <div class="lv-stars" aria-label="${st}/3">${[0, 1, 2].map((i) => `<span class="${i < st ? "on" : ""}">★</span>`).join("")}</div></div>
    ${needs}
    <div class="theory">${theory}</div>
    <div class="row nav">
      <button class="btn" id="prev" ${prevOk ? "" : "disabled"}>${t("prev")}</button>
      <button class="btn ${st ? "go" : ""}" id="next" ${nextOk ? "" : "disabled"}>${t("next")}</button>
    </div>`;
  drawLevelMascot();
  panel.querySelectorAll("[data-ex]").forEach((b) => { b.onclick = () => runFile(L.theory[+b.dataset.ex].code, t("fileExample")); });
  $("to-map").onclick = () => setView("map");
  $("prev").onclick = () => goLesson(S.current - 1);
  $("next").onclick = () => goLesson(S.current + 1);
  renderQuest();
}
function renderQuest() {
  const lv = level(), it = item(), L = it[S.lang], st = S.stars[lv.id] || 0, att = attempt(lv.id);
  const stars = `<span class="q-stars" aria-label="${st}/3">${[0, 1, 2].map((i) => `<span class="${i < st ? "on" : ""}">★</span>`).join("")}</span>`;
  let body;
  if (it.kind === "quiz") {
    const q = L.quiz, qs = ui.quiz || (ui.quiz = { wrong: [], solved: false });
    const opts = q.options.map((o, i) => {
      const cls = qs.solved && i === q.correct ? "right" : qs.wrong.includes(i) ? "wrong" : "";
      return `<button class="qopt ${cls}" data-q="${i}" ${qs.solved || qs.wrong.includes(i) ? "disabled" : ""}><pre>${escHtml(o)}</pre></button>`;
    }).join("");
    body = `<div class="ex"><pre>${highlight(q.code)}</pre></div>
      <div class="eyebrow">${t("quizQ")}</div>
      <div class="qopts">${opts}</div>
      ${qs.wrong.length && !qs.solved ? `<p class="qfb bad">${t("quizWrong")}</p>` : ""}
      ${qs.solved ? `<p class="qfb good">${t("quizRight")} ${escHtml(q.explain)}</p><div class="row"><button class="btn" id="q-run">${t("quizRun")}</button></div>` : ""}
      <p class="rule">${t("quizStar")}</p>`;
  } else {
    const hintBox = ui.hint ? `<div class="hintbox"><div><b>${lv.boss ? t("bossHint") : t("hint")}.</b> ${escHtml(L.hint)}</div></div>` : "";
    const solBox = ui.sol ? `<div class="hintbox"><b>${t("solTitle")}</b><pre>${highlight(L.solution)}</pre><div class="row"><button class="btn tiny" id="usesol">${t("useSol")}</button></div></div>` : "";
    body = `<div class="status ${st ? "ok" : ""}">${st ? t("statusDone") : t("statusTodo")}</div>
      ${hintBox}${solBox}
      <div class="row q-actions">
        <button class="btn" id="hint">${ui.hint ? t("hideHint") : lv.boss ? t("bossHint") : t("hint")}</button>
        <button class="btn" id="sol">${ui.sol ? t("hideSol") : t("sol")}</button>
        <span class="rule">${t("starRule")}</span>
      </div>`;
  }
  questEl.innerHTML = `<div class="q-head"><span class="q-tag">${t("questTag")}</span><span class="q-file">${curFile()}</span>${stars}</div>
    <p class="q-task">${L.task}</p>${body}`;
  if (it.kind === "quiz") {
    questEl.querySelectorAll("[data-q]").forEach((b) => { b.onclick = () => answerQuiz(+b.dataset.q); });
    const qr = $("q-run"); if (qr) qr.onclick = () => runFile(L.quiz.code, curFile());
  } else {
    $("hint").onclick = () => { ui.hint = !ui.hint; if (ui.hint) { att.hint = true; save(); } renderQuest(); };
    $("sol").onclick = () => { ui.sol = !ui.sol; if (ui.sol) { att.sol = true; save(); } renderQuest(); };
    const use = $("usesol");
    if (use) use.onclick = () => { code.focus(); code.select(); insertAt(code, L.solution + "\n"); persistEditor(); };
  }
}
function answerQuiz(i) {
  const q = lesson().quiz, qs = ui.quiz, att = attempt(level().id);
  sfxUnlock();
  if (qs.solved || qs.wrong.includes(i)) return;
  if (i === q.correct) {
    qs.solved = true;
    SFX.right();
    setTimeout(() => { if (S.view === "lessons" && ui.quiz === qs) completeLevel(); }, 900);
    renderQuest(); mascotReact("pass");
  } else {
    qs.wrong.push(i); att.wrong = (att.wrong || 0) + 1; save();
    renderQuest(); mascotReact("fail");
  }
}

/* ---------- Settings ---------- */
const setEl = $("settings");
/* The installable version can hand over a file; inside a preview frame only the save code works */
const CAN_DOWNLOAD = !!document.querySelector('link[rel="manifest"]');
function openSettings() { ui.settings = { code: false, confirm: false, msg: "" }; renderSettings(); setEl.hidden = false; setEl.querySelector(".ocard button").focus(); }
function closeSettings() { setEl.hidden = true; }
function fmtDate(iso) { try { return new Date(iso).toLocaleString(S.lang === "it" ? "it-IT" : "en-GB", { dateStyle: "medium", timeStyle: "short" }); } catch (e) { return iso; } }
function renderSettings() {
  const st = ui.settings;
  const seg = (name, opts, cur) => `<div class="seg small" role="group" aria-label="${escHtml(name)}">${opts.map(([v, l]) => `<button data-set="${name}" data-v="${v}" aria-pressed="${v === cur}">${l}</button>`).join("")}</div>`;
  setEl.querySelector(".ocard").innerHTML = `
    <div class="set-head"><h2 id="set-title">${t("settings")}</h2><button class="btn tiny" id="set-close">${t("close")}</button></div>
    <div class="set-row"><span>${t("setLang")}</span>${seg("lang", [["it", "Italiano"], ["en", "English"]], S.lang)}</div>
    <div class="set-row"><span>${t("setTheme")}</span>${seg("theme", [["auto", t("themeAuto")], ["light", t("themeLight")], ["dark", t("themeDark")]], S.theme)}</div>
    <div class="set-row"><span>${t("setFont")}</span><div class="row"><button class="btn tiny" id="font-down" aria-label="${t("fontDown")}">A−</button><span class="mono">${S.fontSize}px</span><button class="btn tiny" id="font-up" aria-label="${t("fontUp")}">A+</button></div></div>
    <div class="set-row"><span>${t("setSound")}</span>${seg("sound", [["1", t("on")], ["0", t("off")]], S.sound ? "1" : "0")}</div>
    <div class="set-save">
      <div class="set-save-head"><div class="fl-m"></div><div><h3>${t("setSave")}</h3><p>${t("saveInfo")}</p><p class="muted">${S.lastBackup ? t("lastBackup", fmtDate(S.lastBackup)) : t("neverBackup")}</p></div></div>
      <div class="row">${CAN_DOWNLOAD ? `<button class="btn primary" id="save-file">${t("saveFile")}</button>` : ""}<label class="btn" for="load-file">${t("loadFile")}</label><input type="file" id="load-file" accept=".json,.txt,application/json,text/plain" hidden></div>
      <div class="row"><button class="btn" id="show-code">${st.code ? t("hideCode") : t("showCode")}</button></div>
      ${st.code ? `<textarea id="save-code" class="codebox" readonly rows="4">${escHtml(encodeSave(S))}</textarea><div class="row"><button class="btn tiny" id="copy-code">${t("copyCode")}</button></div>` : ""}
      <textarea id="paste-code" class="codebox" rows="3" placeholder="${escHtml(t("pasteCode"))}" aria-label="${escHtml(t("pasteCode"))}"></textarea>
      <div class="row"><button class="btn" id="restore">${t("restore")}</button></div>
      ${st.msg ? `<p class="set-msg" role="status">${escHtml(st.msg)}</p>` : ""}
    </div>
    ${st.confirm ? `<div class="confirm"><p>${t("confirmResetAll")}</p><div class="row"><button class="btn danger" id="reset-y">${t("yesResetAll")}</button><button class="btn" id="reset-n">${t("cancel")}</button></div></div>`
      : `<div><button class="linkbtn" id="reset-all">${t("resetAll")}</button></div>`}`;
  setEl.querySelector(".fl-m").appendChild(mascotCanvas("floppy", "i", ""));
  setEl.querySelectorAll("[data-set]").forEach((b) => {
    b.onclick = () => {
      const k = b.dataset.set, v = b.dataset.v;
      if (k === "lang") setLang(v);
      else if (k === "theme") { S.theme = v; save(); applyTheme(); }
      else if (k === "sound") { S.sound = v === "1"; save(); if (S.sound) { sfxUnlock(); SFX.right(); } applyStatic(); }
      renderSettings();
    };
  });
  $("set-close").onclick = closeSettings;
  $("font-down").onclick = () => { S.fontSize = Math.max(11, S.fontSize - 1); save(); applyFont(); syncScroll(); renderSettings(); };
  $("font-up").onclick = () => { S.fontSize = Math.min(22, S.fontSize + 1); save(); applyFont(); syncScroll(); renderSettings(); };
  if (CAN_DOWNLOAD) $("save-file").onclick = () => {
    persistEditor();
    const date = new Date().toISOString();
    const blob = new Blob([JSON.stringify({ app: "palestra-python", v: 3, date, state: S }, null, 1)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `palestra-python-${date.slice(0, 10)}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    S.lastBackup = date; save();
    ui.settings.msg = t("fileSaved"); renderSettings();
  };
  $("load-file").onchange = (e) => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => restoreFrom(String(r.result));
    r.readAsText(f);
  };
  $("show-code").onclick = () => { ui.settings.code = !ui.settings.code; ui.settings.msg = ""; renderSettings(); };
  const cc = $("copy-code");
  if (cc) cc.onclick = () => {
    const box = $("save-code");
    const ok = () => { S.lastBackup = new Date().toISOString(); save(); cc.textContent = t("copied"); };
    try { navigator.clipboard.writeText(box.value).then(ok, () => { box.focus(); box.select(); }); } catch (e) { box.focus(); box.select(); }
  };
  $("restore").onclick = () => restoreFrom($("paste-code").value);
  const ra = $("reset-all"); if (ra) ra.onclick = () => { ui.settings.confirm = true; renderSettings(); };
  const rn = $("reset-n"); if (rn) rn.onclick = () => { ui.settings.confirm = false; renderSettings(); };
  const ry = $("reset-y");
  if (ry) ry.onclick = () => {
    const keep = { lang: S.lang, programs: S.programs, active: S.active, fontSize: S.fontSize, theme: S.theme, sound: S.sound };
    S = Object.assign(DEFAULTS(), keep); sanitize(); save();
    closeSettings(); ui.msay = ""; ui.quiz = null; ui.open = null; ui.autoW = null;
    applyStatic(); setView("map");
  };
}
function restoreFrom(text) {
  try {
    const o = decodeSave(text);
    S = Object.assign(DEFAULTS(), o.state); sanitize();
    S.lastBackup = o.date || new Date().toISOString();
    save();
    ui.msay = ""; ui.quiz = null; ui.open = null; ui.autoW = null;
    applyTheme(); applyFont(); applyStatic();
    setView(S.view === "term" || S.view === "free" ? S.view : "map");
    ui.settings = { code: false, confirm: false, msg: t("restored") };
  } catch (e) {
    ui.settings.msg = t("restoreFail");
  }
  renderSettings();
}
$("open-settings").onclick = openSettings;
setEl.addEventListener("click", (e) => { if (e.target === setEl) closeSettings(); });
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (!cele.hidden) closeCele();
  else if (!setEl.hidden) closeSettings();
});

/* ---------- Navigation ---------- */
function goLesson(k) {
  if (k < 0 || k >= LEVELS.length || running || !unlocked(k)) return;
  if (S.view === "lessons") persistEditor();
  S.current = k; ui.hint = false; ui.sol = false; ui.quiz = null; ui.msay = ""; ui.mexpr = "i";
  save();
  if (S.view !== "lessons") setView("lessons");
  else { updateLayout(); updateRunUI(); renderPanel(); loadEditor(); }
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function updateLayout() {
  const v = S.view;
  mapEl.hidden = v !== "map";
  grid.hidden = v === "map";
  grid.classList.toggle("termview", v === "term");
  grid.classList.toggle("quizmode", v === "lessons" && isQuiz());
  questEl.hidden = v !== "lessons";
}
function setView(v, initial) {
  if (!initial && running && v !== "term" && S.view !== "term") return;
  if (!initial && (S.view === "lessons" || S.view === "free")) persistEditor();
  S.view = v;
  if (v === "lessons" || v === "free") S.mode = v;
  ui.renaming = false; ui.confirmDel = false;
  save();
  updateLayout();
  $("tab-lessons").setAttribute("aria-selected", v === "lessons" || v === "map");
  $("tab-free").setAttribute("aria-selected", v === "free");
  $("tab-term").setAttribute("aria-selected", v === "term");
  (v === "term" ? termCard : editorCard).appendChild(symbar);
  updateRunUI(); renderPanel();
  if (v === "lessons" || v === "free") loadEditor();
  else if (v === "term") { scrollTerm(); if (!coarse && !initial) focusPrompt(); }
}
$("tab-lessons").onclick = () => setView("map");
$("tab-free").onclick = () => setView("free");
$("tab-term").onclick = () => setView("term");
expandBtn.onclick = () => setView("term");

/* ---------- Boot ---------- */
applyTheme();
applyFont();
setView(S.view, true);
if (S.view === "term" || S.view === "map") loadEditor();
applyStatic();
termWrite(t("loadingFull") + "\n", "dim");
if (document.querySelector('link[rel="manifest"]') && "serviceWorker" in navigator) {
  try { navigator.serviceWorker.register("sw.js").catch(() => {}); } catch (e) {}
}
(async () => {
  let ok = false;
  for (const url of PYODIDE_URLS) { workerURL = url; ok = await startWorker(url); if (ok) break; }
  if (ok) { engine = "pyodide"; pyStatus = "full"; }
  else {
    ok = await loadSkulpt();
    if (ok) { engine = "skulpt"; pyStatus = "basic"; termWrite(t("fallback") + "\n", "dim"); }
    else pyStatus = "fail";
  }
  pyReady = ok;
  applyStatic(); renderPanel();
  if (ok) { termWrite((engine === "pyodide" ? t("readyFull", pyVersion) : t("readyBasic")) + "\n", "dim"); showPrompt(); }
  else termWrite(t("loadFail") + "\n", "err");
})();
</script>
